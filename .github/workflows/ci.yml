name: CI

on:
  push:
    branches: [main]
    # README.md and CONTRIBUTING.md stay out of this list because format:check covers them.
    paths-ignore:
      - "docs/**"
      - AGENTS.md
      - CLA.md
      - CLAUDE.md
      - DESIGN.md
      - RELEASE_NOTES.md
      # server.yml checks and deploys the backend.
      - "server/**"
      # The phone workflows check the phone app.
      - "mobile/**"
      - ".github/workflows/mobile-*.yml"
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  checks: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Cargo.toml builds dependencies at full speed so `make dev` feels fast. CI only
# tests them, and level 1 compiles in about half the time. The cache key carries
# the level, since cargo rebuilds every dependency when it changes.
env:
  DEPS_OPT_LEVEL: 1

jobs:
  frontend:
    name: Frontend quality, build, and tests
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Check project formatting
        run: pnpm format:check

      - name: Lint frontend
        run: pnpm lint

      - name: Typecheck frontend
        run: pnpm typecheck

      - name: Check the grammar manifest matches the installed grammars
        run: pnpm grammars:check

      - name: Check the generated IPC contracts match the Rust commands
        run: pnpm ipc:check

      - name: Check the generated agent tool list matches its source
        run: pnpm agent-tools:check

      - name: Run frontend tests with all-source coverage
        run: pnpm test:coverage

      - name: Build frontend
        run: pnpm build

      - name: Enforce frontend performance budgets
        run: pnpm perf:budget

      - name: Check release tooling without credentials
        run: pnpm release:check

      - name: Lint shell scripts
        run: brew install shellcheck && shellcheck scripts/*.sh

  rust:
    name: Rust formatting, lint, and tests
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust
        run: rustup toolchain install "$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)" --profile minimal --component clippy --component rustfmt --no-self-update

      - name: Build dependencies with light optimisation
        run: printf '[profile.dev.package."*"]\nopt-level = %s\n' "$DEPS_OPT_LEVEL" >>"${CARGO_HOME:-$HOME/.cargo}/config.toml"

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
          key: deps-opt-level-${{ env.DEPS_OPT_LEVEL }}
          cache-on-failure: true

      - name: Audit Rust dependencies
        uses: rustsec/audit-check@858dc40f52ca2b8570b7a997c1c4e35c6fc9a432 # main, Node 24
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: src-tauri

      - name: Prepare Tauri resource placeholder
        run: mkdir -p src-tauri/icons/build && touch src-tauri/icons/build/Assets.car

      - name: Check Rust formatting
        run: cargo fmt --all -- --check
        working-directory: src-tauri

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
        working-directory: src-tauri

      - name: Run Rust tests
        run: cargo test --workspace --all-targets --all-features
        working-directory: src-tauri

      - name: Build without any plugins
        run: cargo clippy -p sikemux --no-default-features --all-targets -- -D warnings
        working-directory: src-tauri

  desktop-e2e:
    name: macOS launched desktop E2E
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        run: rustup toolchain install "$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)" --profile minimal --component clippy --component rustfmt --no-self-update

      - name: Build dependencies with light optimisation
        run: printf '[profile.dev.package."*"]\nopt-level = %s\n' "$DEPS_OPT_LEVEL" >>"${CARGO_HOME:-$HOME/.cargo}/config.toml"

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri -> target/e2e
          key: deps-opt-level-${{ env.DEPS_OPT_LEVEL }}
          cache-on-failure: true

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Launch the built app, open a real editor target and drive a browser tab
        run: pnpm test:e2e:desktop --browser
