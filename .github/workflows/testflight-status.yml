name: TestFlight status

# Temporary and read-only: what App Store Connect says about the latest iPhone builds.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: release
    steps:
      - name: Ask App Store Connect
        env:
          KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          node --input-type=module <<'JS'
          import { createSign } from "node:crypto";
          const b64 = (o) => Buffer.from(JSON.stringify(o)).toString("base64url");
          const now = Math.floor(Date.now() / 1000);
          const head = b64({ alg: "ES256", kid: process.env.KEY_ID, typ: "JWT" });
          const body = b64({ iss: process.env.ISSUER, iat: now, exp: now + 600, aud: "appstoreconnect-v1" });
          const sig = createSign("SHA256").update(`${head}.${body}`).sign({ key: process.env.KEY, dsaEncoding: "ieee-p1363" }).toString("base64url");
          const token = `${head}.${body}.${sig}`;
          const get = async (path) => {
            const r = await fetch(`https://api.appstoreconnect.apple.com${path}`, { headers: { Authorization: `Bearer ${token}` } });
            const j = await r.json();
            if (!r.ok) throw new Error(`${path}: ${r.status} ${JSON.stringify(j.errors?.map((e) => e.detail))}`);
            return j;
          };
          const apps = await get("/v1/apps?limit=20");
          for (const app of apps.data) {
            console.log(`APP ${app.attributes.name} ${app.attributes.bundleId} ${app.id}`);
            const builds = await get(`/v1/builds?filter[app]=${app.id}&sort=-uploadedDate&limit=5&include=preReleaseVersion,buildBetaDetail`);
            const inc = Object.fromEntries((builds.included ?? []).map((x) => [`${x.type}/${x.id}`, x.attributes]));
            for (const b of builds.data) {
              const ver = inc[`preReleaseVersions/${b.relationships.preReleaseVersion.data?.id}`]?.version;
              const beta = inc[`buildBetaDetails/${b.relationships.buildBetaDetail.data?.id}`] ?? {};
              console.log(`BUILD ${ver} (${b.attributes.version}) uploaded=${b.attributes.uploadedDate} processing=${b.attributes.processingState} expired=${b.attributes.expired} internal=${beta.internalBuildState} external=${beta.externalBuildState} compliance=${b.attributes.usesNonExemptEncryption}`);
            }
            const groups = await get(`/v1/apps/${app.id}/betaGroups?limit=20`);
            for (const g of groups.data) {
              const gb = await get(`/v1/betaGroups/${g.id}/builds?limit=5`);
              const testers = await get(`/v1/betaGroups/${g.id}/betaTesters?limit=1`);
              console.log(`GROUP ${g.attributes.name} internal=${g.attributes.isInternalGroup} allBuilds=${g.attributes.hasAccessToAllBuilds} testers>=${testers.data.length} builds=${gb.data.map((x) => x.attributes.version).join(",") || "none"}`);
            }
          }
          JS
