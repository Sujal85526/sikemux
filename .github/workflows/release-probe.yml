name: Release probe

# Temporary: shows why creating a release with the workflow token returns 403.
on:
  workflow_dispatch:
  push:
    tags: ["probe-*"]

permissions:
  contents: write

jobs:
  exact-command:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout the nightly's commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v0.5.1-nightly.1
      - name: Create the release the way release.sh does, as a draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_DEBUG: api
        run: |
          echo "triggered by ${GITHUB_EVENT_NAME} on ${GITHUB_REF}"
          echo probe > probe-asset.txt
          gh release create v0.5.1-nightly.1 --target "$(git rev-parse HEAD)" --title v0.5.1-nightly.1 \
            --notes "$(cat RELEASE_NOTES.md)" --prerelease --draft probe-asset.txt >out.txt 2>&1 || true
          grep -E '^\* Request to|^< HTTP|X-Accepted-Github-Permissions|"message"|"documentation_url"|^https://' out.txt | grep -v Authorization || tail -20 out.txt
          for id in $(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=20" --jq '.[]|select(.draft and .tag_name=="v0.5.1-nightly.1")|.id'); do
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/${id}" && echo "deleted draft ${id}"
          done
