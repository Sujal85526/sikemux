name: Release probe

# Temporary: shows why creating a release with the workflow token returns 403.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  plain:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Try creating a draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if id="$(gh api -X POST "repos/${GITHUB_REPOSITORY}/releases" -f tag_name=v0.5.1-nightly.1 -f name=probe-plain -F draft=true --jq .id)"; then
            echo "created ${id}"; gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/${id}" && echo "deleted ${id}"
          fi

  in-environment:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - name: Try creating a draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if id="$(gh api -X POST "repos/${GITHUB_REPOSITORY}/releases" -f tag_name=v0.5.1-nightly.1 -f name=probe-env -F draft=true --jq .id)"; then
            echo "created ${id}"; gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/${id}" && echo "deleted ${id}"
          fi
