<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Boards · Moodboard Studio</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 28px 32px;
        background: #f6f3ee;
        color: #1d1b19;
        font:
          14px/1.45 -apple-system,
          BlinkMacSystemFont,
          "SF Pro Text",
          system-ui,
          sans-serif;
      }

      header {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        margin-bottom: 22px;
      }

      h1 {
        margin: 0;
        font-size: 26px;
        letter-spacing: -0.02em;
      }

      header span {
        color: #857d73;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        gap: 18px;
      }

      .board {
        overflow: hidden;
        border-radius: 12px;
        background: #fff;
        box-shadow: 0 1px 2px rgb(0 0 0 / 0.06);
      }

      .art {
        aspect-ratio: 4 / 3;
      }

      .meta {
        padding: 12px 14px 14px;
      }

      .meta strong {
        display: block;
        margin-bottom: 8px;
        font-weight: 600;
      }

      .palette {
        display: flex;
        height: 18px;
        overflow: hidden;
        border-radius: 5px;
      }

      .palette i {
        flex: 1;
      }

      .new {
        outline: 2px solid #7c5cff;
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Boards</h1>
      <span>6 boards · palettes from k-means in OKLab</span>
    </header>
    <main class="grid" id="boards"></main>
    <script>
      const boards = [
        [
          "Desert modern",
          "linear-gradient(160deg,#e9c9a3,#c9875a 55%,#6f3f2a)",
          [
            "#f1dcc2",
            "#e2b98f",
            "#c9875a",
            "#a05f3c",
            "#6f3f2a",
            "#3f2a22",
            "#9aa58c",
            "#d7cbb8",
          ],
        ],
        [
          "Nordic coast",
          "linear-gradient(170deg,#dfe7ea,#8fb1c0 50%,#2f4b5a)",
          [
            "#eef2f3",
            "#c8d7dd",
            "#8fb1c0",
            "#5f8799",
            "#2f4b5a",
            "#1c2b33",
            "#c9bfa9",
            "#7d8f7a",
          ],
        ],
        [
          "Tokyo night",
          "linear-gradient(150deg,#2b2152,#6d3fb0 50%,#e0457b)",
          [
            "#141026",
            "#2b2152",
            "#4a2f85",
            "#6d3fb0",
            "#a44bb0",
            "#e0457b",
            "#f2a65a",
            "#5ad1e0",
          ],
        ],
        [
          "Olive grove",
          "linear-gradient(165deg,#e4e1c8,#9ba36b 55%,#4a4f2c)",
          [
            "#f0eee0",
            "#d4d2b0",
            "#9ba36b",
            "#737b45",
            "#4a4f2c",
            "#2e3120",
            "#c79a5b",
            "#8a5a3b",
          ],
        ],
        [
          "Studio ceramics",
          "linear-gradient(155deg,#f2ece4,#d9b8a6 50%,#8c5a4a)",
          [
            "#f7f2ec",
            "#eadcd0",
            "#d9b8a6",
            "#b98a76",
            "#8c5a4a",
            "#553a31",
            "#a7b3b0",
            "#5c6b69",
          ],
        ],
        [
          "Neon arcade",
          "linear-gradient(145deg,#0f1b3d,#1f6fe0 50%,#39f0c5)",
          [
            "#0a1128",
            "#0f1b3d",
            "#1f3f8f",
            "#1f6fe0",
            "#39f0c5",
            "#f7f052",
            "#ff5c8a",
            "#9b5cff",
          ],
        ],
      ];
      document.getElementById("boards").innerHTML = boards
        .map(
          ([name, art, palette], index) => `
            <article class="board">
              <div class="art" style="background:${art}"></div>
              <div class="meta">
                <strong>${name}</strong>
                <div class="palette${index === 1 ? " new" : ""}">${palette.map((colour) => `<i style="background:${colour}"></i>`).join("")}</div>
              </div>
            </article>`,
        )
        .join("");
    </script>
  </body>
</html>
