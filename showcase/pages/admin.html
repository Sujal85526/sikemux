<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Orders · Acme Admin</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        display: grid;
        grid-template-columns: 188px 1fr;
        min-height: 100vh;
        background: #0b0d12;
        color: #e6e8ee;
        font:
          13px/1.45 -apple-system,
          BlinkMacSystemFont,
          "Inter",
          system-ui,
          sans-serif;
      }

      aside {
        padding: 18px 12px;
        border-right: 1px solid #1c212c;
        background: #0e1117;
      }

      .logo {
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 0 8px 18px;
        font-weight: 650;
        font-size: 14px;
      }

      .logo i {
        width: 22px;
        height: 22px;
        border-radius: 6px;
        background: linear-gradient(135deg, #34d399, #0ea5e9);
      }

      nav a {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 7px 10px;
        border-radius: 7px;
        color: #8b93a7;
        text-decoration: none;
      }

      nav a.on {
        background: #161b25;
        color: #e6e8ee;
      }

      nav a b {
        margin-left: auto;
        padding: 0 6px;
        border-radius: 999px;
        background: #1f2633;
        color: #9aa3b8;
        font-size: 11px;
        font-weight: 500;
      }

      .dot {
        width: 6px;
        height: 6px;
        border-radius: 2px;
        background: currentColor;
        opacity: 0.6;
      }

      main {
        padding: 18px 22px;
        min-width: 0;
      }

      .top {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 18px;
      }

      h1 {
        margin: 0;
        font-size: 18px;
        font-weight: 650;
        letter-spacing: -0.01em;
      }

      .search {
        margin-left: auto;
        width: 220px;
        padding: 7px 10px;
        border: 1px solid #1f2430;
        border-radius: 8px;
        background: #0e1117;
        color: #5d667a;
      }

      .avatar {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        background: linear-gradient(135deg, #f59e0b, #ef4444);
      }

      .kpis {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 12px;
        margin-bottom: 14px;
      }

      .card {
        padding: 13px 14px;
        border: 1px solid #1c212c;
        border-radius: 10px;
        background: #11151d;
      }

      .card small {
        color: #8b93a7;
      }

      .card strong {
        display: block;
        margin-top: 4px;
        font-size: 19px;
        font-weight: 650;
        letter-spacing: -0.01em;
      }

      .up {
        color: #34d399;
        font-size: 12px;
      }

      .down {
        color: #f87171;
        font-size: 12px;
      }

      .chart {
        margin-bottom: 14px;
      }

      .chart header {
        display: flex;
        justify-content: space-between;
        margin-bottom: 8px;
        color: #8b93a7;
      }

      svg {
        display: block;
        width: 100%;
        height: 110px;
      }

      table {
        width: 100%;
        border-collapse: collapse;
      }

      th,
      td {
        padding: 9px 10px;
        border-bottom: 1px solid #1a1f29;
        text-align: left;
        white-space: nowrap;
      }

      th {
        color: #6b7489;
        font-size: 11px;
        font-weight: 550;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      td.num {
        font-variant-numeric: tabular-nums;
      }

      .pill {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 2px 8px;
        border-radius: 999px;
        font-size: 11.5px;
      }

      .pill::before {
        content: "";
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: currentColor;
      }

      .paid {
        background: rgb(52 211 153 / 0.12);
        color: #34d399;
      }

      .pending {
        background: rgb(251 191 36 / 0.12);
        color: #fbbf24;
      }

      .failed {
        background: rgb(248 113 113 / 0.12);
        color: #f87171;
      }

      .none {
        color: #4b5365;
      }

      .requested {
        background: rgb(96 165 250 / 0.12);
        color: #60a5fa;
      }

      .refunded {
        background: rgb(167 139 250 / 0.12);
        color: #a78bfa;
      }

      th.new,
      td.new {
        background: rgb(96 165 250 / 0.05);
      }

      @media (max-width: 760px) {
        body {
          grid-template-columns: 52px 1fr;
        }

        aside {
          padding: 18px 8px;
        }

        .logo {
          justify-content: center;
          padding: 0 0 18px;
          font-size: 0;
        }

        nav a {
          justify-content: center;
          font-size: 0;
        }

        nav a b {
          display: none;
        }

        .dot {
          width: 8px;
          height: 8px;
        }

        .search {
          width: 150px;
        }

        .kpis {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .date {
          display: none;
        }

        svg {
          height: 80px;
        }
      }
    </style>
  </head>
  <body>
    <aside>
      <div class="logo"><i></i>Acme Admin</div>
      <nav>
        <a><span class="dot"></span>Overview</a>
        <a class="on"><span class="dot"></span>Orders <b>1,284</b></a>
        <a><span class="dot"></span>Customers</a>
        <a><span class="dot"></span>Products</a>
        <a><span class="dot"></span>Refunds <b>23</b></a>
        <a><span class="dot"></span>Payouts</a>
        <a><span class="dot"></span>Settings</a>
      </nav>
    </aside>
    <main>
      <div class="top">
        <h1>Orders</h1>
        <div class="search">Search orders, customers…</div>
        <div class="avatar"></div>
      </div>
      <section class="kpis">
        <div class="card">
          <small>Revenue · 30d</small><strong>€48,210</strong
          ><span class="up">▲ 12.4%</span>
        </div>
        <div class="card">
          <small>Orders</small><strong>1,284</strong
          ><span class="up">▲ 6.1%</span>
        </div>
        <div class="card">
          <small>Avg order</small><strong>€37.54</strong
          ><span class="up">▲ 5.9%</span>
        </div>
        <div class="card">
          <small>Refund rate</small><strong>1.8%</strong
          ><span class="down">▲ 0.3pt</span>
        </div>
      </section>
      <section class="card chart">
        <header>
          <span>Revenue, last 30 days</span><span>€1,607 / day</span>
        </header>
        <svg viewBox="0 0 600 110" preserveAspectRatio="none">
          <defs>
            <linearGradient id="fill" x1="0" x2="0" y1="0" y2="1">
              <stop offset="0" stop-color="#34d399" stop-opacity="0.35" />
              <stop offset="1" stop-color="#34d399" stop-opacity="0" />
            </linearGradient>
          </defs>
          <path id="area" fill="url(#fill)" />
          <path id="line" fill="none" stroke="#34d399" stroke-width="2" />
        </svg>
      </section>
      <section class="card">
        <table>
          <thead>
            <tr>
              <th>Order</th>
              <th>Customer</th>
              <th class="date">Date</th>
              <th>Payment</th>
              <th class="new">Refund</th>
              <th>Total</th>
            </tr>
          </thead>
          <tbody id="orders"></tbody>
        </table>
      </section>
    </main>
    <script>
      const values = [
        30, 34, 31, 38, 36, 42, 40, 47, 44, 49, 46, 52, 50, 57, 53, 55, 61, 58,
        64, 60, 66, 63, 70, 68, 74, 71, 78, 75, 82, 86,
      ];
      const x = (i) => (i / (values.length - 1)) * 600;
      const y = (v) => 104 - (v - 25) * 1.45;
      const line = values
        .map((v, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(v).toFixed(1)}`)
        .join("");
      document.getElementById("line").setAttribute("d", line);
      document
        .getElementById("area")
        .setAttribute("d", `${line}L600,110L0,110Z`);

      const orders = [
        ["#10482", "Maya Lindqvist", "Today, 09:12", "paid", "none", "€128.40"],
        [
          "#10481",
          "Tomás Herrera",
          "Today, 08:57",
          "paid",
          "requested",
          "€54.90",
        ],
        ["#10480", "Aiko Tanaka", "Today, 08:31", "pending", "none", "€212.00"],
        ["#10479", "Jonas Weber", "Yesterday", "paid", "refunded", "€39.00"],
        ["#10478", "Priya Raman", "Yesterday", "failed", "none", "€76.25"],
        ["#10477", "Lucas Martin", "Yesterday", "paid", "none", "€18.60"],
        ["#10476", "Sofia Rossi", "25 Sep", "paid", "requested", "€145.10"],
      ];
      const label = {
        none: "—",
        requested: "Requested",
        refunded: "Refunded",
        paid: "Paid",
        pending: "Pending",
        failed: "Failed",
      };
      document.getElementById("orders").innerHTML = orders
        .map(
          ([id, name, date, payment, refund, total]) => `
            <tr>
              <td>${id}</td>
              <td>${name}</td>
              <td class="date" style="color:#8b93a7">${date}</td>
              <td><span class="pill ${payment}">${label[payment]}</span></td>
              <td class="new">${refund === "none" ? '<span class="none">—</span>' : `<span class="pill ${refund}">${label[refund]}</span>`}</td>
              <td class="num">${total}</td>
            </tr>`,
        )
        .join("");
    </script>
  </body>
</html>
