<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Sikemux · Twitter</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #000 url("/__showcase/wallpaper") center / cover no-repeat;
      }

      iframe {
        position: fixed;
        inset: 56px 96px;
        width: calc(100% - 192px);
        height: calc(100% - 112px);
        border: 0;
        border-radius: 12px;
        box-shadow:
          0 0 0 1px rgba(255, 255, 255, 0.09),
          0 30px 80px rgba(0, 0, 0, 0.55),
          0 8px 24px rgba(0, 0, 0, 0.35);
      }

      button {
        position: fixed;
        right: 16px;
        bottom: 14px;
        padding: 6px 12px;
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 6px;
        background: rgba(0, 0, 0, 0.6);
        color: #fff;
        font: 500 12px system-ui;
        cursor: pointer;
      }

      .is-capturing button {
        visibility: hidden;
      }
    </style>
  </head>
  <body>
    <iframe src="/showcase/?play" title="Sikemux"></iframe>
    <button type="button">Download</button>
    <script type="module">
      const button = document.querySelector("button");
      const nextFrame = () =>
        new Promise((done) =>
          requestAnimationFrame(() => requestAnimationFrame(done)),
        );

      // Outside `pnpm showcase:twitter` there is no saver, so the browser shares this tab and downloads one frame of it.
      async function downloadFromTab() {
        const stream = await navigator.mediaDevices.getDisplayMedia({
          video: { displaySurface: "browser" },
          preferCurrentTab: true,
        });
        const video = document.createElement("video");
        video.srcObject = stream;
        await video.play();
        document.documentElement.classList.add("is-capturing");
        await nextFrame();
        await new Promise((done) => setTimeout(done, 300));
        const canvas = document.createElement("canvas");
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        canvas.getContext("2d").drawImage(video, 0, 0);
        stream.getTracks().forEach((track) => track.stop());
        document.documentElement.classList.remove("is-capturing");
        const stamp = new Date().toISOString().slice(0, 19).replace(/[T:]/g, "-");
        const link = document.createElement("a");
        link.download = `sikemux-${stamp}.png`;
        link.href = URL.createObjectURL(
          await new Promise((done) => canvas.toBlob(done, "image/png")),
        );
        link.click();
        return link.download;
      }

      button.addEventListener("click", async () => {
        button.disabled = true;
        try {
          const saved = await (window.showcaseDownload?.() ??
            downloadFromTab());
          button.textContent = `Saved ${saved}`;
        } catch (error) {
          button.textContent = "Not saved";
          console.warn(error);
        }
        setTimeout(() => {
          button.textContent = "Download";
          button.disabled = false;
        }, 1600);
      });
    </script>
  </body>
</html>
