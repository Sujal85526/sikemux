<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Sikemux · Twitter</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #000 url("/__showcase/wallpaper") center / cover no-repeat;
      }

      iframe {
        position: fixed;
        inset: 56px 96px;
        width: calc(100% - 192px);
        height: calc(100% - 112px);
        border: 0;
        border-radius: 12px;
        box-shadow:
          0 0 0 1px rgba(255, 255, 255, 0.09),
          0 30px 80px rgba(0, 0, 0, 0.55),
          0 8px 24px rgba(0, 0, 0, 0.35);
      }

      .controls {
        position: fixed;
        right: 16px;
        bottom: 14px;
        display: flex;
        gap: 8px;
      }

      button {
        padding: 6px 12px;
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 6px;
        background: rgba(0, 0, 0, 0.6);
        color: #fff;
        font: 500 12px system-ui;
        cursor: pointer;
      }

      input {
        display: none;
      }

      .is-capturing .controls {
        visibility: hidden;
      }
    </style>
  </head>
  <body>
    <iframe src="/showcase/?play" title="Sikemux"></iframe>
    <div class="controls">
      <button type="button" class="wallpaper">Wallpaper</button>
      <button type="button" class="download">Download</button>
      <input type="file" accept="image/*" />
    </div>
    <script type="module">
      const button = document.querySelector(".download");
      const picker = document.querySelector("input");

      // The server keeps the picture, so its own Chrome paints the same wallpaper into each download.
      document.querySelector(".wallpaper").addEventListener("click", () =>
        picker.click(),
      );
      picker.addEventListener("change", async () => {
        const [file] = picker.files;
        if (!file) return;
        await fetch("/__showcase/wallpaper", { method: "POST", body: file });
        document.body.style.backgroundImage = `url("/__showcase/wallpaper?v=${Date.now()}")`;
        picker.value = "";
      });
      const app = document.querySelector("iframe").contentWindow;

      // A page cannot screenshot itself, so the showcase server renders this view in its own Chrome.
      async function saveOnServer() {
        const response = await fetch("/__showcase/snapshot", {
          method: "POST",
          body: JSON.stringify({
            state: app.showcase.store.getState(),
            width: innerWidth,
            height: innerHeight,
          }),
        });
        const saved = await response.json();
        if (!response.ok) throw new Error(saved.error);
        return saved;
      }

      button.addEventListener("click", async () => {
        button.disabled = true;
        try {
          const saved = await saveOnServer();
          button.textContent = `Saved ${saved}`;
        } catch (error) {
          button.textContent = "Not saved";
          console.warn(error);
        }
        setTimeout(() => {
          button.textContent = "Download";
          button.disabled = false;
        }, 1600);
      });
    </script>
  </body>
</html>
