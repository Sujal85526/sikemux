<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.css" />
  <style>
    html, body, #terminal {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #05070b;
    }
    .xterm {
      height: 100%;
      padding: 10px 8px 12px;
      box-sizing: border-box;
    }
    .fallback {
      color: #d7e0ee;
      font: 13px/1.45 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      white-space: pre-wrap;
      padding: 12px;
    }
  </style>
</head>
<body>
  <div id="terminal"></div>
  <script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.js"></script>
  <script>
    let term = null;
    let fallback = null;

    function decodeBase64Utf8(b64) {
      const binary = atob(b64 || '');
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
      return new TextDecoder('utf-8', { fatal: false }).decode(bytes);
    }

    function fallbackWrite(text, reset) {
      if (!fallback) {
        const host = document.getElementById('terminal');
        host.innerHTML = '';
        fallback = document.createElement('div');
        fallback.className = 'fallback';
        host.appendChild(fallback);
      }
      if (reset) fallback.textContent = '';
      // Basic ANSI stripping fallback. xterm should be present in normal use.
      fallback.textContent += text.replace(/\x1b\[[0-9;?]*[ -/]*[@-~]/g, '');
      fallback.scrollTop = fallback.scrollHeight;
    }

    function init() {
      if (!window.Terminal) {
        fallbackWrite('xterm.js failed to load. Check Android network access.\n', true);
        return;
      }
      term = new Terminal({
        convertEol: true,
        cursorBlink: true,
        scrollback: 10000,
        fontSize: 13,
        fontFamily: 'ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace',
        theme: {
          background: '#05070b',
          foreground: '#d7e0ee',
          cursor: '#36d399',
          selectionBackground: '#26415f',
          black: '#0b1020', red: '#f87171', green: '#36d399', yellow: '#fbbf24',
          blue: '#60a5fa', magenta: '#c084fc', cyan: '#22d3ee', white: '#e5e7eb',
          brightBlack: '#64748b', brightRed: '#fb7185', brightGreen: '#86efac', brightYellow: '#fde68a',
          brightBlue: '#93c5fd', brightMagenta: '#d8b4fe', brightCyan: '#67e8f9', brightWhite: '#ffffff'
        }
      });
      term.open(document.getElementById('terminal'));
      term.onData((data) => {
        if (window.SikemuxTerminal && window.SikemuxTerminal.onInput) {
          window.SikemuxTerminal.onInput(data);
        }
      });
      term.focus();
    }

    window.sikemuxWrite = function(b64) {
      const text = decodeBase64Utf8(b64);
      if (term) term.write(text);
      else fallbackWrite(text, false);
    };

    window.sikemuxResetAndWrite = function(b64) {
      const text = decodeBase64Utf8(b64);
      if (term) {
        term.reset();
        term.write(text);
        term.focus();
      } else {
        fallbackWrite(text, true);
      }
    };

    window.addEventListener('load', init);
  </script>
</body>
</html>
