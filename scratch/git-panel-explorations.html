<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Git panel explorations — low-strain code review</title>
<style>
/* ---------------------------------------------------------------------------
 * Tokens lifted from src/styles/base.css + modern-shell.css so these mocks
 * read as the real app. A few review-only tokens are added on top.
 * ------------------------------------------------------------------------ */
@font-face { font-family:"JetBrainsMono Nerd Font"; src:url("../public/fonts/JetBrainsMonoNerdFontMono-Regular.woff2") format("woff2"); font-weight:400; }
@font-face { font-family:"JetBrainsMono Nerd Font"; src:url("../public/fonts/JetBrainsMonoNerdFontMono-Bold.woff2") format("woff2"); font-weight:700; }
@font-face { font-family:"JetBrainsMono Nerd Font"; src:url("../public/fonts/JetBrainsMonoNerdFontMono-Italic.woff2") format("woff2"); font-weight:400; font-style:italic; }
@font-face { font-family:"Figtree"; src:url("../public/fonts/Figtree-latin-wght-normal.woff2") format("woff2"); font-weight:300 900; }

:root{
  --void:#0c0b10; --rail:#121119; --rail-2:#17161f; --pane:#15141b;
  --line:#242130; --line-soft:#1c1a26;
  --ink:#e7e5ef; --ink-dim:#8b8898; --ink-faint:#565461;
  --acc:#a277ff; --acc-soft:rgba(162,119,255,.13); --acc-line:rgba(162,119,255,.32);
  --live:#61ffca; --warn:#ffca85; --cmd:#ff6ac1; --danger:#ff6767;
  --mono:"JetBrainsMono Nerd Font","JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --ui:"Figtree",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  --radius-chip:2px; --radius-control:4px; --radius-panel:10px;

  /* review-only additions: desaturated change ink, no big fills */
  --add-ink:#8fe3bd; --add-mark:#3f7d63;
  --del-ink:#e39b9b; --del-mark:#7d4a4a;
  --add-wash:rgba(97,255,202,.045);
  --del-wash:rgba(255,103,103,.05);
  --code-line:1.72;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  background:var(--void); color:var(--ink); font-family:var(--ui);
  font-size:13.5px; letter-spacing:-.005em; -webkit-font-smoothing:antialiased;
  overflow:hidden;
}
/* density toggle */
body.compact{--code-line:1.5}

/* ---------- chrome around the exploration itself ---------- */
.deck{display:grid;grid-template-columns:250px 1fr;height:100%}
.deck-rail{
  border-right:1px solid var(--line-soft); background:var(--rail);
  display:flex;flex-direction:column;overflow:hidden;
}
.deck-brand{padding:16px 16px 10px;border-bottom:1px solid var(--line-soft)}
.deck-brand h1{font-size:13px;font-weight:700;letter-spacing:.01em}
.deck-brand p{font-size:11.5px;color:var(--ink-faint);margin-top:3px;line-height:1.45}
.deck-list{flex:1;overflow-y:auto;padding:8px}
.deck-item{
  display:block;width:100%;text-align:left;background:none;border:0;cursor:pointer;
  padding:9px 10px;border-radius:var(--radius-control);color:var(--ink-dim);
  font:inherit;font-size:12.5px;line-height:1.35;
}
.deck-item b{display:block;color:var(--ink);font-weight:620;font-size:12.5px}
.deck-item span{display:block;color:var(--ink-faint);font-size:11px;margin-top:2px}
.deck-item:hover{background:var(--rail-2)}
.deck-item.on{background:var(--acc-soft);box-shadow:inset 0 0 0 1px var(--acc-line)}
.deck-item.on b{color:var(--ink)}
.deck-foot{padding:10px 12px;border-top:1px solid var(--line-soft);display:flex;gap:8px;align-items:center}
.tgl{
  border:1px solid var(--line);background:var(--rail-2);color:var(--ink-dim);
  border-radius:var(--radius-control);padding:4px 8px;font:inherit;font-size:11px;cursor:pointer;
}
.tgl.on{color:var(--ink);border-color:var(--acc-line);background:var(--acc-soft)}

.deck-stage{display:flex;flex-direction:column;overflow:hidden;background:var(--void)}
.stage-note{
  padding:10px 18px;border-bottom:1px solid var(--line-soft);background:var(--rail);
  display:flex;gap:14px;align-items:baseline;flex-wrap:wrap;
}
.stage-note h2{font-size:13px;font-weight:700}
.stage-note p{font-size:11.5px;color:var(--ink-dim);max-width:92ch;line-height:1.5}
.stage-body{flex:1;overflow:hidden;position:relative}
/* Visibility must beat each option's own `display:grid` — same specificity and
 * declared later in the sheet, so it needs !important rather than a reorder. */
.opt{position:absolute;inset:0;overflow:hidden}
.opt:not(.on){display:none!important}

/* ---------- shared primitives ---------- */
.mono{font-family:var(--mono)}
.chip{
  display:inline-flex;align-items:center;gap:5px;height:19px;padding:0 6px;
  border-radius:var(--radius-chip);font-size:10.5px;font-family:var(--ui);
  color:var(--ink-dim);background:var(--rail-2);border:1px solid transparent;white-space:nowrap;
}
.chip.acc{color:var(--acc);background:var(--acc-soft)}
.chip.live{color:var(--live);background:rgba(97,255,202,.09)}
.dot{width:5px;height:5px;border-radius:50%;background:currentColor;flex:none}
.kbd{
  font-family:var(--ui);font-size:10px;color:var(--ink-faint);
  border:1px solid var(--line);border-radius:2px;padding:1px 4px;line-height:1.2;
}
.bar{display:flex;align-items:center;gap:10px;padding:0 14px;height:38px;flex:none}
.bar.top{border-bottom:1px solid var(--line-soft);background:var(--rail)}
.bar.bottom{border-top:1px solid var(--line-soft);background:var(--rail);height:30px;font-size:11px;color:var(--ink-faint)}
.spacer{flex:1}
.seg{display:flex;background:var(--rail-2);border-radius:var(--radius-control);padding:2px;gap:2px}
.seg button{
  border:0;background:none;color:var(--ink-dim);font:inherit;font-size:12px;
  padding:3px 11px;border-radius:2px;cursor:pointer;display:flex;gap:6px;align-items:center;
}
.seg button.on{background:color-mix(in srgb,var(--acc) 16%,var(--rail-2));color:var(--ink)}
.seg button i{font-style:normal;font-size:10.5px;color:var(--ink-faint)}
.seg button.on i{color:var(--acc)}
.ghost{
  border:0;background:none;color:var(--ink-dim);font:inherit;font-size:12px;
  padding:4px 8px;border-radius:var(--radius-control);cursor:pointer;display:flex;gap:6px;align-items:center;
}
.ghost:hover{background:var(--rail-2);color:var(--ink)}
.branch{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:650}
.branch .glyph{color:var(--ink-faint);font-family:var(--mono)}
.ahead{font-size:11px;color:var(--ink-faint);font-family:var(--ui)}

/* ---------- the quiet diff (shared by most options) ---------- */
.dh{ /* file header */
  display:flex;align-items:center;gap:10px;padding:8px 16px;
  border-bottom:1px solid var(--line-soft);
  position:sticky;top:0;background:color-mix(in srgb,var(--pane) 94%,var(--void));backdrop-filter:blur(8px);z-index:2;
}
.dh .path{font-family:var(--mono);font-size:12px;color:var(--ink-faint)}
.dh .name{font-family:var(--mono);font-size:12px;color:var(--ink);font-weight:700}
.stat{display:flex;gap:7px;font-size:11px;font-family:var(--ui)}
.stat .a{color:var(--add-mark)}
.stat .d{color:var(--del-mark)}
.spark{display:flex;gap:2px;align-items:center}
.spark i{width:4px;height:9px;border-radius:1px;background:var(--line);display:block}
.spark i.a{background:var(--add-mark)} .spark i.d{background:var(--del-mark)}

.code{font-family:var(--mono);font-size:12.5px;line-height:var(--code-line);white-space:pre;tab-size:4}
.hunk{padding:2px 0}
.hunk-cap{
  display:flex;align-items:center;gap:10px;padding:7px 16px;color:var(--ink-faint);
  font-size:11px;font-family:var(--ui);cursor:pointer;
}
.hunk-cap:hover{color:var(--ink-dim)}
.hunk-cap .rule{flex:1;height:1px;background:var(--line-soft)}
.ln{
  display:grid;grid-template-columns:46px 14px 1fr;align-items:baseline;
  padding:0 16px 0 0;
}
.ln .no{
  text-align:right;padding-right:12px;color:#3d3b48;font-size:11px;font-family:var(--mono);
  user-select:none;
}
.ln .mk{color:#3d3b48;text-align:center;user-select:none;font-size:11px}
.ln.add .mk{color:var(--add-mark)} .ln.del .mk{color:var(--del-mark)}
.ln.add{background:var(--add-wash)} .ln.del{background:var(--del-wash)}
.ln.add .no{color:var(--add-mark)} .ln.del .no{color:var(--del-mark)}
.ln.ctx .src{color:#8e8b9c}          /* context recedes */
.ln.add .src{color:var(--ink)}        /* the new truth is the brightest thing */
.ln.del .src{color:#9a8f95}
.src .c-com{color:#5b5866;font-style:italic}
.src .c-var{color:#b9b3ce}
.src .c-num{color:#c9b58f}
.src .c-str{color:#9fc7ad}
.ln.ctx .src .c-com,.ln.ctx .src .c-var,.ln.ctx .src .c-num{color:inherit;opacity:.85}

/* no-wash variant: change signalled by marker + ink weight only */
.code.inkonly .ln.add,.code.inkonly .ln.del{background:none}
.code.inkonly .ln.add .src{color:var(--add-ink)}
.code.inkonly .ln.del .src{color:var(--del-ink);opacity:.62}
.code.inkonly .ln .mk{font-weight:700}

/* ---------- 1. STAGE ---------- */
.o1{display:grid;grid-template-rows:38px 1fr 30px}
.o1-body{display:grid;grid-template-columns:288px 1fr;overflow:hidden}
.o1-rail{border-right:1px solid var(--line-soft);background:var(--rail);overflow-y:auto}
.o1-diff{overflow-y:auto;background:var(--pane)}
.crow{
  display:grid;grid-template-columns:12px 1fr;gap:10px;padding:9px 14px 9px 12px;cursor:pointer;
  border-left:2px solid transparent;
}
.crow:hover{background:var(--rail-2)}
.crow.on{background:var(--acc-soft);border-left-color:var(--acc)}
.crow .rail-g{position:relative;display:flex;justify-content:center;padding-top:5px}
.crow .rail-g::before{content:"";position:absolute;top:0;bottom:-12px;width:1px;background:var(--line)}
.crow .rail-g em{
  width:5px;height:5px;border-radius:50%;background:#4a4757;position:relative;z-index:1;
  box-shadow:0 0 0 3px var(--rail);
}
.crow.on .rail-g em{background:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
.crow .subj{font-size:12.5px;color:var(--ink);line-height:1.35;font-weight:520}
.crow.dimmed .subj{color:var(--ink-dim)}
.crow .meta{font-size:10.5px;color:var(--ink-faint);margin-top:3px;display:flex;gap:8px;align-items:center}
.crow .meta .h{font-family:var(--mono)}
.rail-head{
  display:flex;align-items:center;gap:8px;padding:10px 14px 8px;
  font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-faint);
}
.o1-cmt{
  padding:12px 14px;border-bottom:1px solid var(--line-soft);background:var(--rail-2);
}
.o1-cmt textarea{
  width:100%;min-height:52px;resize:none;background:var(--void);border:1px solid var(--line);
  border-radius:var(--radius-control);color:var(--ink);font-family:var(--ui);font-size:12.5px;padding:8px 9px;
}
.o1-cmt textarea::placeholder{color:var(--ink-faint)}
.wip{
  display:flex;align-items:center;gap:9px;padding:8px 14px;border-bottom:1px solid var(--line-soft);
  background:color-mix(in srgb,var(--warn) 7%,var(--rail));font-size:12px;
}
.wip .m{font-family:var(--mono);font-size:11.5px;color:var(--warn)}
.filejog{display:flex;align-items:center;gap:4px}
.filejog button{
  border:1px solid var(--line);background:var(--rail-2);color:var(--ink-dim);
  border-radius:var(--radius-control);width:22px;height:22px;cursor:pointer;font-size:11px;
}
.diff-title{padding:16px 16px 12px;border-bottom:1px solid var(--line-soft)}
.diff-title h3{font-size:15px;font-weight:640;letter-spacing:-.01em;line-height:1.3}
.diff-title .sub{margin-top:6px;display:flex;gap:10px;align-items:center;font-size:11.5px;color:var(--ink-faint)}
.fileline{
  display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;
  padding:7px 16px;cursor:pointer;font-family:var(--mono);font-size:12px;
}
.fileline:hover{background:var(--rail-2)}
.fileline.on{background:var(--acc-soft)}
.fileline .p{color:var(--ink-faint)}
.fileline .n{color:var(--ink)}

/* ---------- 2. RIBBON ---------- */
.o2{display:grid;grid-template-rows:auto auto 1fr 30px}
.ribbon{
  display:flex;gap:0;overflow-x:auto;padding:10px 14px 12px;border-bottom:1px solid var(--line-soft);
  background:var(--rail);align-items:stretch;
}
.rb{
  flex:none;width:172px;padding:9px 11px;border-radius:var(--radius-control);cursor:pointer;
  border:1px solid transparent;position:relative;
}
.rb:hover{background:var(--rail-2)}
.rb.on{background:var(--acc-soft);border-color:var(--acc-line)}
.rb .t{font-size:10.5px;color:var(--ink-faint);font-family:var(--mono)}
.rb .s{font-size:12px;color:var(--ink-dim);margin-top:5px;line-height:1.35;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rb.on .s{color:var(--ink)}
.rb::after{content:"";position:absolute;left:-1px;right:-1px;bottom:-13px;height:1px;background:var(--line-soft)}
.rb .node{
  position:absolute;left:11px;bottom:-16px;width:7px;height:7px;border-radius:50%;
  background:#4a4757;box-shadow:0 0 0 3px var(--rail);z-index:2;
}
.rb.on .node{background:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
.filestrip{
  display:flex;gap:6px;overflow-x:auto;padding:9px 14px;border-bottom:1px solid var(--line-soft);
  background:var(--pane);
}
.fchip{
  flex:none;display:flex;align-items:center;gap:8px;padding:5px 10px;border-radius:var(--radius-control);
  border:1px solid var(--line-soft);background:var(--rail);cursor:pointer;font-family:var(--mono);font-size:11.5px;color:var(--ink-dim);
}
.fchip.on{border-color:var(--acc-line);background:var(--acc-soft);color:var(--ink)}
.fchip s{text-decoration:none;font-size:10px;color:var(--ink-faint);font-family:var(--ui)}
.o2-reader{overflow-y:auto;background:var(--pane)}

/* ---------- 3. QUIET READER ---------- */
.o3{display:grid;grid-template-columns:1fr 168px;overflow:hidden}
.o3-main{overflow-y:auto;background:var(--pane)}
.o3-doc{max-width:104ch;margin:0 auto;padding:0 0 80px}
.o3-h{padding:30px 24px 18px}
.o3-h .eyebrow{font-size:11px;color:var(--ink-faint);letter-spacing:.06em;text-transform:uppercase}
.o3-h h3{font-size:19px;font-weight:600;letter-spacing:-.015em;margin-top:9px;line-height:1.35}
.o3-h .who{margin-top:10px;font-size:11.5px;color:var(--ink-faint);display:flex;gap:10px;align-items:center}
.o3-file{margin:26px 0 0}
.o3-file h4{
  font-family:var(--mono);font-size:12.5px;font-weight:700;padding:0 24px 9px;
  display:flex;gap:10px;align-items:center;
}
.o3-file h4 span{color:var(--ink-faint);font-weight:400}
.o3-index{border-left:1px solid var(--line-soft);background:var(--rail);padding:14px 0;overflow-y:auto}
.o3-index .lbl{font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-faint);padding:0 14px 8px}
.o3-index a{
  display:block;padding:5px 14px;font-family:var(--mono);font-size:11px;color:var(--ink-faint);
  text-decoration:none;border-left:2px solid transparent;
}
.o3-index a.on{color:var(--ink);border-left-color:var(--acc);background:var(--acc-soft)}
.o3-index a b{display:block;color:inherit;font-weight:400}
.o3-index a em{font-style:normal;font-family:var(--ui);font-size:10px;color:var(--ink-faint)}

/* ---------- 4. REVIEW QUEUE ---------- */
.o4{display:grid;grid-template-columns:56px 1fr;overflow:hidden}
.o4-rail{
  background:var(--rail);border-right:1px solid var(--line-soft);
  display:flex;flex-direction:column;align-items:center;padding:14px 0;gap:12px;
}
.o4-rail .pill{
  width:8px;height:8px;border-radius:50%;background:#332f3f;position:relative;
}
.o4-rail .pill.done{background:var(--add-mark)}
.o4-rail .pill.now{background:var(--acc);box-shadow:0 0 0 4px var(--acc-soft)}
.o4-rail .grp{font-family:var(--mono);font-size:9px;color:var(--ink-faint);writing-mode:vertical-rl;margin:2px 0}
.o4-main{display:grid;grid-template-rows:auto 1fr auto;overflow:hidden}
.o4-head{padding:14px 22px 12px;border-bottom:1px solid var(--line-soft);background:var(--rail)}
.o4-head .row1{display:flex;align-items:center;gap:12px}
.o4-head h3{font-family:var(--mono);font-size:13px;font-weight:700}
.o4-head .prog{margin-top:9px;height:2px;background:var(--line);border-radius:2px;overflow:hidden}
.o4-head .prog i{display:block;height:100%;width:34%;background:var(--acc)}
.o4-head .sub{margin-top:7px;font-size:11.5px;color:var(--ink-faint)}
.o4-scroll{overflow-y:auto;background:var(--pane);padding:26px 0 40px}
.o4-card{
  max-width:100ch;margin:0 auto 22px;border:1px solid var(--line-soft);border-radius:var(--radius-panel);
  background:color-mix(in srgb,var(--void) 45%,var(--pane));overflow:hidden;
}
.o4-card.next{opacity:.4}
.o4-cap{
  display:flex;align-items:center;gap:10px;padding:9px 16px;border-bottom:1px solid var(--line-soft);
  font-size:11px;color:var(--ink-faint);font-family:var(--ui);
}
.o4-why{
  padding:10px 16px;border-bottom:1px solid var(--line-soft);font-size:12px;color:var(--ink-dim);
  background:color-mix(in srgb,var(--acc) 5%,transparent);line-height:1.5;
}
.o4-act{display:flex;gap:8px;align-items:center;padding:10px 16px;border-top:1px solid var(--line-soft)}
.btn{
  border:1px solid var(--line);background:var(--rail-2);color:var(--ink);font:inherit;font-size:12px;
  padding:5px 11px;border-radius:var(--radius-control);cursor:pointer;display:flex;gap:7px;align-items:center;
}
.btn.pri{border-color:var(--acc-line);background:var(--acc-soft);color:var(--ink)}
.o4-foot{
  border-top:1px solid var(--line-soft);background:var(--rail);padding:0 22px;height:34px;
  display:flex;align-items:center;gap:16px;font-size:11px;color:var(--ink-faint);
}

/* ---------- 5. FILE CARDS ---------- */
.o5{display:grid;grid-template-rows:auto 1fr;overflow:hidden}
.o5-head{padding:16px 22px 14px;border-bottom:1px solid var(--line-soft);background:var(--rail)}
.o5-head h3{font-size:15px;font-weight:640;letter-spacing:-.01em}
.o5-head .meta{margin-top:7px;display:flex;gap:14px;align-items:center;font-size:11.5px;color:var(--ink-faint)}
.o5-bars{margin-top:11px;display:flex;gap:3px;height:4px}
.o5-bars i{flex:1;border-radius:2px;background:var(--line)}
.o5-bars i.done{background:var(--add-mark)}
.o5-bars i.now{background:var(--acc)}
.o5-scroll{overflow-y:auto;padding:16px 22px 60px;background:var(--pane)}
.card{
  border:1px solid var(--line-soft);border-radius:var(--radius-panel);margin-bottom:10px;
  background:color-mix(in srgb,var(--void) 40%,var(--pane));overflow:hidden;
}
.card.reviewed{opacity:.55}
.card-head{display:grid;grid-template-columns:20px 1fr auto;gap:12px;align-items:center;padding:11px 14px;cursor:pointer}
.card-head:hover{background:var(--rail-2)}
.cbox{
  width:15px;height:15px;border-radius:3px;border:1px solid var(--line);display:grid;place-items:center;
  font-size:9px;color:var(--void);
}
.cbox.on{background:var(--add-mark);border-color:var(--add-mark);color:#0c0b10}
.card-head .fn{font-family:var(--mono);font-size:12.5px}
.card-head .fn s{text-decoration:none;color:var(--ink-faint)}
.card-head .why{font-size:11.5px;color:var(--ink-dim);margin-top:3px;font-family:var(--ui)}
.card-body{border-top:1px solid var(--line-soft);background:var(--pane)}

/* ---------- 6. TWO-UP ---------- */
.o6{display:grid;grid-template-rows:38px 1fr}
.two{display:grid;grid-template-columns:1fr 1fr;overflow-y:auto;background:var(--pane);align-items:start}
.two .col{border-right:1px solid var(--line-soft)}
.two .col:last-child{border-right:0}
.two .colhead{
  position:sticky;top:0;padding:8px 16px;background:color-mix(in srgb,var(--pane) 94%,var(--void));
  border-bottom:1px solid var(--line-soft);font-size:11px;color:var(--ink-faint);
  display:flex;gap:8px;align-items:center;backdrop-filter:blur(8px);z-index:2;
}
.two .ln{grid-template-columns:44px 1fr}
.two .ln.pad{background:repeating-linear-gradient(135deg,transparent 0 6px,rgba(255,255,255,.014) 6px 12px)}
.two .ln.pad .src{color:transparent}

/* ---------- 7. MAP ---------- */
.o7{display:grid;grid-template-columns:1fr 1fr;overflow:hidden}
.o7-left{overflow-y:auto;background:var(--rail);border-right:1px solid var(--line-soft);padding:18px 20px 60px}
.o7-left h3{font-size:13px;font-weight:660;margin-bottom:4px}
.o7-left .hint{font-size:11.5px;color:var(--ink-faint);margin-bottom:18px}
.grp7{margin-bottom:20px}
.grp7 .gh{
  display:flex;align-items:baseline;gap:9px;font-family:var(--mono);font-size:11.5px;
  color:var(--ink-dim);padding-bottom:8px;
}
.grp7 .gh em{font-style:normal;font-family:var(--ui);font-size:10.5px;color:var(--ink-faint)}
.mrow{
  display:grid;grid-template-columns:1fr 92px 54px;gap:12px;align-items:center;
  padding:6px 8px;border-radius:var(--radius-control);cursor:pointer;
}
.mrow:hover{background:var(--rail-2)}
.mrow.on{background:var(--acc-soft);box-shadow:inset 0 0 0 1px var(--acc-line)}
.mrow .nm{font-family:var(--mono);font-size:12px;color:var(--ink)}
.mrow .nm em{font-style:normal;color:var(--ink-faint)}
.mrow .tag{font-size:10.5px;color:var(--ink-faint);margin-top:2px}
.mbar{display:flex;height:6px;border-radius:3px;overflow:hidden;background:var(--line-soft)}
.mbar i.a{background:var(--add-mark)} .mbar i.d{background:var(--del-mark)}
.mnum{font-size:10.5px;color:var(--ink-faint);text-align:right;font-family:var(--mono)}
.o7-right{overflow-y:auto;background:var(--pane)}
</style>
</head>
<body>
<div class="deck">
  <aside class="deck-rail">
    <div class="deck-brand">
      <h1>Git panel — 7 relayouts</h1>
      <p>Same data, seven ways to read it. Everything optimised for one thing: how little you have to hold in your head while reviewing.</p>
    </div>
    <div class="deck-list" id="deckList"></div>
    <div class="deck-foot">
      <button class="tgl on" id="densityBtn">comfortable</button>
      <button class="tgl on" id="washBtn">soft wash</button>
    </div>
  </aside>
  <main class="deck-stage">
    <div class="stage-note" id="note"></div>
    <div class="stage-body" id="stageBody"></div>
  </main>
</div>

<script>

 * ====================================================================== */
const COMMITS = [
  {h:'91c2d39', s:'row names share one font across both rails',      scope:'fix(ui)',   t:'1m',  files:2, a:14, d:9,  badge:['HEAD','main']},
  {h:'abeda90', s:'30% column, no terminal, focus-driven panels',    scope:'feat(git)', t:'3m',  files:7, a:210,d:96},
  {h:'1c53fe1', s:'tint whole diff lines, not words',                scope:'fix(git)',  t:'11m', files:3, a:38, d:22},
  {h:'e8666e3', s:'content panels really do not shrink now',         scope:'fix(git)',  t:'18m', files:2, a:19, d:11, badge:['origin/main']},

  {h:'784acf6', s:'stop short panels beating the graph',             scope:'fix(git)',  t:'23m', files:1, a:9,  d:4},
  {h:'5087ca9', s:'size panels to their content, tighten chips',     scope:'fix(git)',  t:'35m', files:6, a:119,d:67, sel:true},
  {h:'b7cabb9', s:'rails round like the panels do',                  scope:'fix(ui)',   t:'41m', files:4, a:31, d:24},
  {h:'224a524', s:'show the state before the name',                  scope:'fix(agents)',t:'43m',files:2, a:17, d:13},
  {h:'23d9be2', s:'two radii instead of four',                       scope:'refactor(ui)',t:'46m',files:9,a:64, d:71},
  {h:'7e1f0dc', s:'drop the rail footer border',                     scope:'fix(ui)',   t:'49m', files:1, a:2,  d:5},

const FILES = [

  {p:'src/components/',     n:'Panel.tsx',         k:'ts',  a:6, d:4,  why:'accepts an intrinsic-height hint'},

/* hunks for modern-shell.css */
const HUNKS = [
  {cap:'@@ -11,9 +11,13 @@  :root', gapBefore:10, lines:[
    ['ctx',11,11,'    /* Two radii, and only two: panels and controls. The four-step ramp meant'],
    ['ctx',12,12,'     * neighbouring elements rounded differently for no reason anyone could'],
    ['ctx',13,13,'     * name. The old names stay as aliases so call sites need not all change. */'],
    ['add',null,14,'    /* Radius scales with the control: 6px on an 18px-tall button is a third'],
    ['add',null,15,'     * of its height and reads as a pill, so compact chips take less. */'],
    ['del',14,null,'    --radius-xs: 3px;'],
    ['add',null,16,'    --radius-chip: 3px;'],
    ['ctx',15,17,'    --radius-control: 6px;'],
    ['ctx',16,18,'    --radius-panel: 10px;'],
    ['add',null,19,'    --radius-xs: var(--radius-control);'],
  ]},
  {cap:'@@ -682,6 +684,5 @@  rounding by role', gapBefore:662, lines:[
    ['ctx',682,684,'        .settings-depth,'],
    ['ctx',683,685,'        .git-toolbar,'],
    ['ctx',684,686,'        .git-tbtn,'],
    ['del',685,null,'        .panel-abtn,'],
    ['ctx',686,687,'        .git-dd-btn,'],
    ['ctx',687,688,'        .git-dd-menu,'],
  ]},
  {cap:'@@ -838,3 +840,8 @@  chip rounding', gapBefore:149, lines:[
    ['ctx',838,840,'}'],
    ['ctx',839,841,''],
    ['add',null,842,'.shell :where(.rnd-btn-sm, .git-kbd, .panel-akbd, .picker-hint) {'],
    ['add',null,843,'    border-radius: var(--radius-chip) !important;'],
    ['add',null,844,'}'],
    ['add',null,845,''],
    ['ctx',840,846,'/* ---- Rounding by role ------------------------------------------ */'],
    ['ctx',841,847,' * The geometry pass above works off a hand-picked list of selectors,'],
  ]},
];

/* =========================================================================
 * helpers
 * ====================================================================== */
const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;');
function hl(s){
  if(/^\s*(\/\*|\*|\/\/|\*\/)/.test(s)) return `<span class="c-com">${esc(s)}</span>`;
  let o = esc(s);
  o = o.replace(/(--[a-z-]+)/g,'<span class="c-var">$1</span>');
  o = o.replace(/\b(\d+(?:\.\d+)?(?:px|em|rem|%|s|ch)?)\b/g,'<span class="c-num">$1</span>');
  o = o.replace(/('[^']*')/g,'<span class="c-str">$1</span>');
  return o;
}
const MK = {ctx:' ', add:'+', del:'−'};
function line([t,o,n,s], mode){
  const no = mode==='new' ? (n ?? '') : mode==='old' ? (o ?? '') : (n ?? o ?? '');
  return `<div class="ln ${t}"><span class="no">${no}</span><span class="mk">${MK[t]}</span><span class="src">${hl(s)}</span></div>`;
}
function hunks(opts={}){
  const cls = opts.inkonly ? 'code inkonly' : 'code';
  return `<div class="${cls}">` + HUNKS.map(h=>`
    <div class="hunk">
      <div class="hunk-cap"><span class="rule"></span><span>${h.gapBefore} unchanged lines · click to expand</span><span class="rule"></span></div>
      ${h.lines.map(l=>line(l)).join('')}
    </div>`).join('') + `</div>`;
}
function spark(a,d,n=9){
  const total=a+d, av=Math.max(1,Math.round(n*a/total));
  return `<span class="spark">${Array.from({length:n},(_,i)=>`<i class="${i<av?'a':'d'}"></i>`).join('')}</span>`;
}
function fileHeader(f){
  return `<div class="dh">
    <span class="path">${f.p}</span><span class="name">${f.n}</span>
    <span class="spacer"></span>
    <span class="stat"><span class="a">+${f.a}</span><span class="d">−${f.d}</span></span>${spark(f.a,f.d)}
  </div>`;
}

/* =========================================================================
 * the seven options
 * ====================================================================== */
const OPTS = [];

/* ---- 1 ---- */
OPTS.push({
  id:'stage', title:'1 · Stage', tag:'one job at a time',
  note:'The four stacked panels become one. A segmented control picks the <b>mode</b> — Working, History, Branches — so the sidebar only ever shows one list. Commit composition is a mode, not a permanent box. The diff gets 100% of the right side and never scrolls a second list next to it.',
  html:`<div class="opt o1">
    <div class="bar top">
      <span class="branch"><span class="glyph"></span>main</span>
      <span class="ahead">↑3 ahead</span>
      <span class="spacer"></span>
      <div class="seg">
        <button><span>Working</span><i>1</i></button>
        <button class="on"><span>History</span></button>
        <button><span>Branches</span><i>5</i></button>
      </div>
      <span class="spacer"></span>
      <button class="ghost">push <span class="kbd">P</span></button>
      <button class="ghost">pull <span class="kbd">p</span></button>
      <button class="ghost">fetch <span class="kbd">F</span></button>
    </div>
    <div class="o1-body">
      <div class="o1-rail">
        <div class="wip"><span class="m">1 uncommitted</span><span style="color:var(--ink-dim)">CommitReview.tsx</span><span class="spacer"></span><span class="kbd">c</span></div>
        ${COMMITS.map(c=>`
          <div class="crow ${c.sel?'on':''} ${c.sel?'':'dimmed'}">
            <div class="rail-g"><em></em></div>
            <div>
              <div class="subj">${c.s}</div>
              <div class="meta"><span class="h">${c.h}</span>·<span>${c.t}</span>·<span>${c.files} files</span>
                ${(c.badge||[]).map(b=>`<span class="chip ${b==='HEAD'?'acc':'live'}"><span class="dot"></span>${b}</span>`).join('')}
              </div>
            </div>
          </div>`).join('')}
      </div>
      <div class="o1-diff">
        <div class="diff-title">
          <h3>fix(git): size panels to their content, tighten chips</h3>
          <div class="sub"><span class="mono">5087ca9</span>·<span>35m ago</span>·<span>6 files</span>
            <span class="stat"><span class="a">+119</span><span class="d">−67</span></span>
            <span class="spacer"></span>
            <span class="filejog"><button>↑</button><button>↓</button><span style="font-size:11px;color:var(--ink-faint);margin-left:6px">file 5 of 6</span></span>
          </div>
        </div>
        ${FILES.map(f=>f.open?'':`<div class="fileline"><span><span class="p">${f.p}</span><span class="n">${f.n}</span></span><span class="stat"><span class="a">+${f.a}</span><span class="d">−${f.d}</span></span></div>`).join('')}
        ${fileHeader(FILES[4])}
        ${hunks()}
      </div>
    </div>
    <div class="bar bottom"><span>j/k commit</span><span>n/p file</span><span>space next hunk</span><span>c commit</span><span class="spacer"></span><span>1 cmd</span></div>
  </div>`
});

/* ---- 2 ---- */
OPTS.push({
  id:'ribbon', title:'2 · Ribbon', tag:'history goes horizontal',
  note:'History is a <b>scrubber</b>, not a column. Time runs left→right along the top, files run as a chip strip underneath, and the whole width below belongs to the code. You never split attention between two vertical lists again.',
  html:`<div class="opt o2">
    <div class="ribbon">
      ${COMMITS.map(c=>`<div class="rb ${c.sel?'on':''}"><span class="node"></span>
        <div class="t">${c.h} · ${c.t}</div><div class="s">${c.s}</div></div>`).join('')}
    </div>
    <div class="filestrip">
      ${FILES.map(f=>`<div class="fchip ${f.open?'on':''}">${f.n}<s>+${f.a} −${f.d}</s></div>`).join('')}
    </div>
    <div class="o2-reader">
      ${fileHeader(FILES[4])}
      ${hunks()}
    </div>
    <div class="bar bottom"><span class="mono">5087ca9</span><span>fix(git): size panels to their content</span><span class="spacer"></span><span>h/l commit</span><span>tab file</span></div>
  </div>`
});

/* ---- 3 ---- */

  html:`<div class="opt o3">
    <div class="o3-main"><div class="o3-doc">
      <div class="o3-h">
        <div class="eyebrow">reviewing commit</div>

      </div>

        <h4>modern-shell.css <span>src/styles/ · +19 −6</span></h4>
        ${hunks({inkonly:true})}
      </div>
      <div class="o3-file">
        <h4>panel.css <span>src/styles/ · +4 −12</span></h4>
        <div class="code inkonly">
          <div class="hunk">
            <div class="hunk-cap"><span class="rule"></span><span>44 unchanged lines · click to expand</span><span class="rule"></span></div>
            ${[['ctx',44,44,'.panel {'],['del',45,null,'    border-radius: var(--radius-md);'],['add',null,45,'    border-radius: var(--radius-panel);'],['ctx',46,46,'    background: var(--pane);'],['ctx',47,47,'}']].map(l=>line(l)).join('')}
          </div>
        </div>

      <div class="lbl" style="margin-top:16px">nearby</div>
      <a><b>← 784acf6</b><em>previous</em></a>
      <a><b>→ 75fae5e</b><em>next</em></a>
    </nav>
  </div>`
});

OPTS.push({
  id:'queue', title:'4 · Review queue', tag:'one hunk, then the next',
  note:'The most aggressive load reducer: you are never shown a whole commit, only <b>the hunk you are on</b>. Progress lives in the left rail (a dot per hunk, green when cleared) and the bar up top. Space clears a hunk, <span class="mono">?</span> flags it. Big diffs stop feeling like a wall.',
  html:`<div class="opt o4">
    <div class="o4-rail">
      <span class="pill done"></span><span class="pill done"></span><span class="pill done"></span>
      <span class="grp">git.css</span>
      <span class="pill done"></span><span class="pill now"></span><span class="pill"></span><span class="pill"></span>

      <span class="grp">panes</span>
      <span class="pill"></span><span class="pill"></span>

    <div class="o4-main">
      <div class="o4-head">
        <div class="row1">

          <span class="chip">hunk 5 of 14</span>
          <span class="spacer"></span>
          <span class="stat"><span class="a">+19</span><span class="d">−6</span></span>

        </div>
        <div class="prog"><i></i></div>
        <div class="sub">fix(git): size panels to their content, tighten chips · 5087ca9</div>
      </div>
      <div class="o4-scroll">
        <div class="o4-card">
          <div class="o4-cap"><span class="mono">@@ -11,9 +11,13 @@</span><span>:root</span><span class="spacer"></span><span>3 added · 1 removed</span></div>
          <div class="o4-why">Introduces <span class="mono">--radius-chip</span> and re-points <span class="mono">--radius-xs</span> at the control radius — the alias keeps old call sites working.</div>
          <div class="code">${HUNKS[0].lines.map(l=>line(l)).join('')}</div>
          <div class="o4-act">
            <button class="btn pri">looks right <span class="kbd">space</span></button>
            <button class="btn">flag <span class="kbd">?</span></button>
            <button class="btn">expand context <span class="kbd">e</span></button>
            <span class="spacer"></span>
            <span style="font-size:11px;color:var(--ink-faint)">4 cleared · 10 left</span>
          </div>
        </div>
        <div class="o4-card next">
          <div class="o4-cap"><span class="mono">@@ -682,6 +684,5 @@</span><span>rounding by role</span><span class="spacer"></span><span>up next</span></div>
          <div class="code">${HUNKS[1].lines.slice(0,4).map(l=>line(l)).join('')}</div>
        </div>

/* ---- 5 ---- */
OPTS.push({
  id:'cards', title:'5 · File digest', tag:'a checklist you can put down',
  note:'Every file collapses to <b>one line plus a plain-English summary</b>, with a review checkbox. You triage first, read second, and the header bar shows how much of the commit you have actually cleared — so an interrupted review resumes instead of restarting.',

    <div class="o5-head">
      <h3>fix(git): size panels to their content, tighten chips</h3>
      <div class="meta"><span class="mono">5087ca9</span><span>6 files · +119 −67</span><span class="chip live"><span class="dot"></span>2 reviewed</span><span class="spacer"></span><button class="ghost">collapse all</button></div>
      <div class="o5-bars"><i class="done"></i><i class="done"></i><i class="now"></i><i></i><i></i><i></i></div>
    </div>
    <div class="o5-scroll">
      ${FILES.map((f,i)=>`
        <div class="card ${i<2?'reviewed':''}">

            <span class="cbox ${i<2?'on':''}">${i<2?'✓':''}</span>
            <span><span class="fn"><s>${f.p}</s>${f.n}</span><div class="why">${f.why}</div></span>
            <span class="stat"><span class="a">+${f.a}</span><span class="d">−${f.d}</span>${spark(f.a,f.d,7)}</span>

/* ---- 6 ---- */
OPTS.push({
  id:'twoup', title:'6 · Two-up', tag:'before / after, aligned',
  note:'For rewrites, an inline diff makes you diff in your head. Here <b>old sits left, new sits right</b>, aligned line for line with hatched padding where one side has nothing. Unchanged runs collapse to a rule so only the deltas take vertical space.',
  html:`<div class="opt o6">
    <div class="bar top">
      <span class="mono" style="font-size:12px">src/styles/modern-shell.css</span>
      <span class="chip">two-up</span>
      <span class="spacer"></span>
      <span class="stat"><span class="a">+19</span><span class="d">−6</span></span>
      <button class="ghost">inline <span class="kbd">i</span></button>
    </div>
    <div class="two">

      <div class="col">

/* ---- 7 ---- */
OPTS.push({
  id:'map', title:'7 · Map then drill', tag:'shape of the change first',
  note:'Answers “what did this commit <b>do</b>” before showing a single line of code. Files group by area with add/delete bars, so you spot the 200-line file and the one-line drive-by instantly, then click to open it on the right. Overview and detail, never four lists.',
  html:`<div class="opt o7">
    <div class="o7-left">
      <h3>fix(git): size panels to their content, tighten chips</h3>
      <div class="hint">6 files across 3 areas · +119 −67 · biggest change is GitPane.tsx</div>
      ${group7('src/components — behaviour', FILES.slice(0,3))}
      ${group7('src/styles — appearance', FILES.slice(3))}
      <div class="grp7">
        <div class="gh">what moved <em>derived</em></div>
        <div class="mrow"><span><span class="nm">--radius-chip</span><div class="tag">new token · used in 4 places</div></span><span class="mbar"><i class="a" style="flex:4"></i></span><span class="mnum">new</span></div>
        <div class="mrow"><span><span class="nm">--radius-xs<em>, --radius-sm</em></span><div class="tag">now aliases</div></span><span class="mbar"><i class="a" style="flex:2"></i><i class="d" style="flex:2"></i></span><span class="mnum">±2</span></div>
        <div class="mrow"><span><span class="nm">.panel-abtn</span><div class="tag">dropped from the geometry list</div></span><span class="mbar"><i class="d" style="flex:3"></i></span><span class="mnum">−1</span></div>
      </div>
    </div>
    <div class="o7-right">
      ${fileHeader(FILES[4])}
      ${hunks()}
    </div>
  </div>`
});

function group7(title, files){
  const max = Math.max(...FILES.map(f=>f.a+f.d));
  return `<div class="grp7"><div class="gh">${title} <em>${files.length} files</em></div>
    ${files.map(f=>{
      const w = Math.round(88*(f.a+f.d)/max);
      return `<div class="mrow ${f.open?'on':''}">
        <span><span class="nm">${f.n}</span><div class="tag">${f.why}</div></span>
        <span class="mbar" style="width:${Math.max(14,w)}px"><i class="a" style="flex:${f.a}"></i><i class="d" style="flex:${f.d}"></i></span>
        <span class="mnum">+${f.a} −${f.d}</span>
      </div>`;
    }).join('')}</div>`;
}

function twoUp(side){
  /* pair the inline hunks into aligned old/new columns */
  let out='';
  HUNKS.forEach(h=>{
    out += `<div class="hunk-cap"><span class="rule"></span><span>${h.gapBefore} unchanged</span><span class="rule"></span></div>`;
    const adds = h.lines.filter(l=>l[0]==='add'), dels = h.lines.filter(l=>l[0]==='del');
    const pad = Math.max(adds.length, dels.length);
    h.lines.forEach(l=>{
      const [t,o,n,s]=l;
      if(t==='ctx'){ out += l2(t, side==='old'?o:n, s); return; }
      if(side==='old' && t==='del') out += l2('del', o, s);
      if(side==='new' && t==='add') out += l2('add', n, s);
    });
    /* balance the columns so both sides stay the same height */
    const need = side==='old' ? adds.length-dels.length : dels.length-adds.length;
    for(let i=0;i<need;i++) out += `<div class="ln pad"><span class="no"></span><span class="src"> </span></div>`;
  });
  return out;
}
function l2(t,no,s){
  return `<div class="ln ${t}"><span class="no">${no??''}</span><span class="src">${hl(s)}</span></div>`;
}

/* =========================================================================
 * mount
 * ====================================================================== */
const list = document.getElementById('deckList');
const body = document.getElementById('stageBody');
const note = document.getElementById('note');
OPTS.forEach((o,i)=>{
  const b=document.createElement('button');
  b.className='deck-item'+(i===0?' on':'');
  b.innerHTML=`<b>${o.title}</b><span>${o.tag}</span>`;
  b.onclick=()=>show(i);
  list.appendChild(b);
  const w=document.createElement('div');
  w.innerHTML=o.html;
  const el=w.firstElementChild;
  if(i===0) el.classList.add('on');
  body.appendChild(el);
});
function show(i){
  [...list.children].forEach((b,j)=>b.classList.toggle('on',i===j));
  [...body.children].forEach((s,j)=>s.classList.toggle('on',i===j));
  note.innerHTML=`<h2>${OPTS[i].title} — ${OPTS[i].tag}</h2><p>${OPTS[i].note}</p>`;
}
show(0);
document.addEventListener('keydown',e=>{
  const n=parseInt(e.key,10);
  if(n>=1&&n<=OPTS.length) show(n-1);
});
const dBtn=document.getElementById('densityBtn');
dBtn.onclick=()=>{
  document.body.classList.toggle('compact');
  const c=document.body.classList.contains('compact');
  dBtn.textContent=c?'compact':'comfortable';
  dBtn.classList.toggle('on',!c);
};
const wBtn=document.getElementById('washBtn');
wBtn.onclick=()=>{
  const off=document.documentElement.style.getPropertyValue('--add-wash')==='transparent';
  document.documentElement.style.setProperty('--add-wash',off?'rgba(97,255,202,.045)':'transparent');
  document.documentElement.style.setProperty('--del-wash',off?'rgba(255,103,103,.05)':'transparent');
  wBtn.textContent=off?'soft wash':'no wash';
  wBtn.classList.toggle('on',off);
};
</script>
