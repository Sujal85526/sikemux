<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Review — git panel prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ===========================================================================
 * One design, built for reading.
 *
 * Neutral graphite — no hue in the greys, so the only coloured things on screen
 * are the two that carry meaning (added / removed) and the one that says
 * "you are here". Change is signalled by a 2px edge plus a 4% wash; context
 * recedes; added lines are the brightest ink in the window.
 * ======================================================================== */
:root{
  --bg:#0d0e11;
  --surface:#14161a;
  --surface-2:#1b1e23;
  --surface-3:#22262c;
  --sunken:#101216;
  --line:rgba(255,255,255,.075);
  --line-2:rgba(255,255,255,.045);
  --text:#e9ebef;
  --text-2:#a2a8b2;
  --text-3:#6b727d;
  --num:#474d57;

  --accent:#8098ff;
  --accent-wash:rgba(128,152,255,.10);
  --accent-line:rgba(128,152,255,.34);

  --add:#7fdfab; --add-edge:#2f7d5a; --add-wash:rgba(127,223,171,.05);
  --del:#efa2a2; --del-edge:#8a4646; --del-wash:rgba(239,162,162,.045);

  --shadow:0 1px 2px rgba(0,0,0,.45), 0 16px 40px -20px rgba(0,0,0,.8);
  --knob:0 1px 2px rgba(0,0,0,.4);

  --ui:"Inter",-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;
  --mono:"JetBrains Mono","SF Mono",ui-monospace,Menlo,monospace;
  --r-sm:6px; --r:9px; --r-lg:13px;
  --code:12.5px; --lead:1.7;
  --side:300px; --outline:196px;
}
body.tight{--lead:1.46}
body.focusmode{--side:0px; --outline:0px}

*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  background:var(--bg); color:var(--text); font-family:var(--ui); font-size:13px;
  line-height:1.5; -webkit-font-smoothing:antialiased; overflow:hidden;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea{font:inherit;color:inherit}
::selection{background:rgba(128,152,255,.26)}
.mono{font-family:var(--mono);font-variant-ligatures:none}
.grow{flex:1}
.num{font-variant-numeric:tabular-nums}

/* ------------------------------------------------------------- app frame -- */
.app{
  display:grid; height:100%;
  grid-template-columns:var(--side) minmax(0,1fr) var(--outline);
  grid-template-rows:46px minmax(0,1fr) 30px;
  grid-template-areas:"top top top" "side main outline" "status status status";
  transition:grid-template-columns .18s ease;
}
.top{grid-area:top;display:flex;align-items:center;gap:10px;padding:0 14px;
  background:var(--surface);border-bottom:1px solid var(--line-2);z-index:20}
.side{grid-area:side;background:var(--surface);border-right:1px solid var(--line-2);
  display:flex;flex-direction:column;overflow:hidden}
.main{grid-area:main;overflow-y:auto;overflow-x:hidden;position:relative;background:var(--bg);scroll-behavior:smooth}
.outline{grid-area:outline;background:var(--surface);border-left:1px solid var(--line-2);
  overflow-y:auto;padding:14px 0 24px}
.status{grid-area:status;display:flex;align-items:center;gap:16px;padding:0 14px;
  background:var(--surface);border-top:1px solid var(--line-2);font-size:11.5px;color:var(--text-3)}
body.focusmode .side,body.focusmode .outline{display:none}

/* ------------------------------------------------------------ primitives -- */
.btn{display:inline-flex;align-items:center;gap:7px;height:27px;padding:0 10px;border-radius:var(--r-sm);
  border:1px solid var(--line);background:var(--surface-2);font-size:12.5px;font-weight:450;box-shadow:var(--knob)}
.btn:hover{background:var(--surface-3)}
.btn:disabled{opacity:.4;cursor:default}
.btn.plain{border-color:transparent;background:none;box-shadow:none;color:var(--text-2)}
.btn.plain:hover{background:var(--surface-2);color:var(--text)}
.btn.solid{background:var(--accent);color:#0b0d13;border-color:transparent;font-weight:550}
.btn.solid:hover{filter:brightness(1.08)}
.btn.sm{height:23px;padding:0 8px;font-size:11.5px}
.btn.icon{width:27px;padding:0;justify-content:center}
.key{font-family:var(--mono);font-size:10px;color:var(--text-3);border:1px solid var(--line);
  border-radius:4px;padding:0 4px;line-height:15px;white-space:nowrap}
.btn .key{border-color:rgba(255,255,255,.14)}
.btn.solid .key{color:rgba(11,13,19,.7);border-color:rgba(11,13,19,.25)}
.tag{display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 7px;border-radius:5px;
  background:var(--surface-2);color:var(--text-2);font-size:11px;font-weight:500;white-space:nowrap}
.tag.accent{background:var(--accent-wash);color:var(--accent)}
.tag.good{background:var(--add-wash);color:var(--add)}
.pin{width:5px;height:5px;border-radius:50%;background:currentColor;flex:none}
.seg{display:inline-flex;background:var(--sunken);border-radius:8px;padding:2px;gap:2px;border:1px solid var(--line-2)}
.seg button{display:flex;align-items:center;gap:6px;height:23px;padding:0 11px;border-radius:6px;
  font-size:12px;font-weight:500;color:var(--text-2)}
.seg button i{font-style:normal;font-family:var(--mono);font-size:10.5px;color:var(--text-3)}
.seg button[aria-selected="true"]{background:var(--surface-3);color:var(--text);box-shadow:var(--knob)}
.plus{color:var(--add);font-size:11.5px;font-weight:500;font-variant-numeric:tabular-nums}
.minus{color:var(--del);font-size:11.5px;font-weight:500;font-variant-numeric:tabular-nums}
.bars{display:inline-flex;gap:2px;align-items:center}
.bars i{width:3px;height:9px;border-radius:1px;background:var(--line);display:block}
.bars i.a{background:var(--add-edge)} .bars i.d{background:var(--del-edge)}
.track{display:flex;gap:3px;align-items:center}
.track i{height:3px;flex:1;border-radius:2px;background:var(--line);display:block}
.track i.done{background:var(--add-edge)} .track i.now{background:var(--accent)}

/* ---------------------------------------------------------------- topbar -- */
.brand{display:flex;align-items:center;gap:8px;font-weight:600;font-size:13px;letter-spacing:-.01em}
.brand .dot{width:6px;height:6px;border-radius:50%;background:var(--add);box-shadow:0 0 0 3px var(--add-wash)}
.top .sep{width:1px;height:18px;background:var(--line-2)}

/* ------------------------------------------------------------------ side -- */
.side-top{padding:10px;border-bottom:1px solid var(--line-2);display:flex;flex-direction:column;gap:9px}
.filter{display:flex;align-items:center;gap:7px;height:27px;padding:0 9px;border-radius:var(--r-sm);
  background:var(--sunken);border:1px solid var(--line-2)}
.filter:focus-within{border-color:var(--accent-line);background:var(--surface-2)}
.filter input{flex:1;border:0;background:none;outline:none;font-size:12.5px}
.filter input::placeholder{color:var(--text-3)}
.filter .g{color:var(--text-3);font-size:11px}
.side-list{flex:1;overflow-y:auto;padding-bottom:20px}
.side-empty{padding:26px 16px;color:var(--text-3);font-size:12px;text-align:center}

.crow{display:block;width:100%;text-align:left;padding:10px 14px;position:relative;border-bottom:1px solid var(--line-2)}
.crow:hover{background:var(--surface-2)}
.crow[aria-current="true"]{background:var(--accent-wash)}
.crow[aria-current="true"]::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--accent)}
.crow.cursor::after{content:"";position:absolute;inset:0;border:1px solid var(--accent-line);pointer-events:none}
.crow .s{font-size:12.5px;font-weight:500;line-height:1.4}
.crow .m{margin-top:5px;display:flex;gap:7px;align-items:center;font-size:11px;color:var(--text-3);flex-wrap:wrap}
.crow .m .h{font-family:var(--mono);font-size:10.5px}
.crow .m .up{color:var(--accent)}
.crow.done .s{color:var(--text-2)}
.crow .rv{position:absolute;right:12px;top:11px;font-size:10px;color:var(--add)}

/* working-tree mode */
.wrow{display:grid;grid-template-columns:16px 12px 1fr auto;gap:9px;align-items:center;width:100%;
  text-align:left;padding:8px 14px;border-bottom:1px solid var(--line-2)}
.wrow:hover{background:var(--surface-2)}
.wrow .st{font-family:var(--mono);font-size:11px;color:var(--warn,#e3b778)}
.wrow .nm{font-family:var(--mono);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wrow .nm span{color:var(--text-3)}
.check{width:15px;height:15px;border-radius:4px;border:1.5px solid var(--line);display:grid;place-items:center;
  font-size:9px;color:transparent;flex:none}
.check.on{background:var(--add);border-color:var(--add);color:#0b120e}
.check.accent.on{background:var(--accent);border-color:var(--accent);color:#0b0d13}
.compose{padding:10px;border-top:1px solid var(--line-2);display:flex;flex-direction:column;gap:8px;background:var(--sunken)}
.compose textarea{width:100%;height:64px;resize:none;background:var(--surface-2);border:1px solid var(--line-2);
  border-radius:var(--r-sm);padding:8px 9px;font-size:12.5px;outline:none;line-height:1.45}
.compose textarea:focus{border-color:var(--accent-line)}
.compose textarea::placeholder{color:var(--text-3)}
.compose .r{display:flex;align-items:center;gap:8px}

/* ------------------------------------------------------------------ main -- */
.doc{max-width:1080px;margin:0 auto;padding:0 0 200px}
body.focusmode .doc{max-width:960px}
.dhead{padding:30px 26px 20px}
.dhead .k{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--text-3);font-weight:600}
.dhead h1{font-size:21px;font-weight:600;letter-spacing:-.025em;line-height:1.3;margin-top:11px;max-width:60ch}
.dhead .m{margin-top:13px;display:flex;gap:11px;align-items:center;font-size:12.5px;color:var(--text-3);flex-wrap:wrap}
.dhead .hash{font-family:var(--mono);font-size:11.5px;padding:2px 6px;border-radius:5px;background:var(--surface-2)}
.dhead .hash:hover{background:var(--surface-3);color:var(--text)}
.dhead .body{margin-top:16px;font-size:13px;color:var(--text-2);line-height:1.65;max-width:76ch;white-space:pre-wrap}
.progress{margin:20px 26px 0;padding:11px 14px;border:1px solid var(--line-2);border-radius:var(--r);
  background:var(--surface);display:flex;align-items:center;gap:14px}
.progress .t{font-size:12px;color:var(--text-2)}
.progress .track{flex:1;max-width:340px}

/* file section */
.fsec{margin:22px 0 0;scroll-margin-top:56px}
.fsec.collapsed .fbody{display:none}
.fbar{
  position:sticky;top:0;z-index:6;display:grid;grid-template-columns:16px 1fr auto;gap:12px;align-items:center;
  padding:10px 26px;background:color-mix(in srgb,var(--bg) 82%,transparent);
  backdrop-filter:blur(12px) saturate(1.4);border-top:1px solid var(--line-2);border-bottom:1px solid var(--line-2);
}
.fsec.focused .fbar{border-bottom-color:var(--accent-line)}
.fbar .nm{font-family:var(--mono);font-size:12.5px;font-weight:500;display:flex;align-items:baseline;gap:0}
.fbar .nm span{color:var(--text-3);font-weight:400}
.fbar .why{font-size:11.5px;color:var(--text-3);margin-top:2px}
.fbar .right{display:flex;align-items:center;gap:9px}
.fsec.reviewed .nm,.fsec.reviewed .why{opacity:.45}
.fbtn{display:grid;place-items:center;width:22px;height:22px;border-radius:5px;color:var(--text-3);font-size:11px}
.fbtn:hover{background:var(--surface-2);color:var(--text)}
.fbtn[aria-pressed="true"]{background:var(--accent-wash);color:var(--accent)}
.fbody{background:var(--sunken);border-bottom:1px solid var(--line-2)}

/* ------------------------------------------------------------------ code -- */
.code{font-family:var(--mono);font-size:var(--code);line-height:var(--lead);white-space:pre;tab-size:4;padding:4px 0}
.row{display:grid;grid-template-columns:54px 2px minmax(0,1fr);align-items:baseline}
.row .n{text-align:right;padding-right:13px;color:var(--num);font-size:11px;font-variant-numeric:tabular-nums;
  user-select:none;cursor:pointer}
.row .n:hover{color:var(--text-2)}
.row .e{height:100%;background:transparent}
.row .s{padding:0 26px 0 13px;color:var(--text-2);overflow-wrap:anywhere;white-space:pre-wrap}
.row.add{background:var(--add-wash)} .row.del{background:var(--del-wash)}
.row.add .e{background:var(--add-edge)} .row.del .e{background:var(--del-edge)}
.row.add .s{color:var(--text)} .row.del .s{color:var(--text-2);opacity:.78}
.row.add .n{color:var(--add)} .row.del .n{color:var(--del)}
.row.picked{background:var(--accent-wash)}
.row.picked .e{background:var(--accent)}
.row.picked .n{color:var(--accent)}
.row .s em{font-style:normal;border-radius:3px;padding:0 1px;margin:0 -1px}
.row.add .s em{background:color-mix(in srgb,var(--add-edge) 42%,transparent);color:#eafff3}
.row.del .s em{background:color-mix(in srgb,var(--del-edge) 40%,transparent)}
.t-com{color:#5f656e;font-style:italic}
.t-str{color:#83c9b4} .t-num{color:#d0ab7e} .t-key{color:#a9a2e8} .t-fn{color:#8fb6e8}

.skip{display:flex;align-items:center;gap:10px;padding:5px 26px 5px 0;font-size:11px;color:var(--text-3)}
.skip .r{flex:1;height:1px;background:var(--line-2)}
.skip button{font-size:11px;color:var(--text-3);padding:1px 7px;border-radius:5px}
.skip button:hover{background:var(--surface-2);color:var(--text)}
.hcap{display:flex;align-items:center;gap:10px;padding:7px 26px 7px 54px;font-size:11px;color:var(--text-3);
  font-family:var(--mono);scroll-margin-top:96px}
.hcap .sc{font-family:var(--ui);color:var(--text-2)}

/* split view */
.split{display:grid;grid-template-columns:1fr 1fr}
.split .half{min-width:0;border-right:1px solid var(--line-2)}
.split .half:last-child{border-right:0}
.split .cap{padding:6px 16px;font-size:11px;color:var(--text-3);border-bottom:1px solid var(--line-2);
  display:flex;gap:8px;align-items:center}
.split .row{grid-template-columns:44px 2px minmax(0,1fr)}
.split .row .s{padding-right:14px}
.split .row.void{background:repeating-linear-gradient(135deg,transparent 0 5px,var(--line-2) 5px 6px)}
.split .row.void .s{color:transparent}

/* --------------------------------------------------------------- outline -- */
.outline .lbl{padding:0 14px 8px;font-size:10px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--text-3);font-weight:600}
.orow{display:grid;grid-template-columns:12px 1fr;gap:8px;width:100%;text-align:left;padding:6px 14px;
  border-left:2px solid transparent}
.orow:hover{background:var(--surface-2)}
.orow[aria-current="true"]{border-left-color:var(--accent);background:var(--accent-wash)}
.orow .tick{font-size:9px;color:var(--add);padding-top:2px}
.orow .nm{font-family:var(--mono);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.orow .sub{font-size:10px;color:var(--text-3);margin-top:2px;display:flex;gap:6px;align-items:center}
.orow.reviewed .nm{color:var(--text-3)}
.osep{height:1px;background:var(--line-2);margin:12px 14px}

/* -------------------------------------------------------------- overlays -- */
.selbar{
  position:fixed;left:50%;bottom:52px;transform:translateX(-50%) translateY(8px);
  display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:11px;
  background:color-mix(in srgb,var(--surface-3) 92%,transparent);backdrop-filter:blur(14px);
  border:1px solid var(--line);box-shadow:var(--shadow);z-index:40;opacity:0;pointer-events:none;
  transition:opacity .14s ease,transform .14s ease;
}
.selbar.on{opacity:1;pointer-events:auto;transform:translateX(-50%) translateY(0)}
.selbar .c{font-size:12px;color:var(--text-2);padding:0 4px}
.toast{
  position:fixed;left:50%;bottom:52px;transform:translateX(-50%) translateY(8px);
  padding:8px 14px;border-radius:9px;background:var(--surface-3);border:1px solid var(--line);
  box-shadow:var(--shadow);font-size:12.5px;z-index:60;opacity:0;pointer-events:none;transition:.16s ease;
}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.sheet{
  position:fixed;inset:0;background:rgba(6,7,9,.62);backdrop-filter:blur(3px);z-index:80;
  display:grid;place-items:center;opacity:0;pointer-events:none;transition:opacity .14s ease;
}
.sheet.on{opacity:1;pointer-events:auto}
.sheet .card{
  width:520px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  box-shadow:var(--shadow);overflow:hidden;
}
.sheet h3{padding:16px 20px 14px;font-size:13.5px;font-weight:600;border-bottom:1px solid var(--line-2)}
.sheet .keys{padding:8px 20px 18px;display:grid;grid-template-columns:1fr 1fr;gap:2px 26px}
.sheet .kr{display:flex;align-items:center;gap:10px;padding:6px 0;font-size:12.5px;color:var(--text-2)}
.sheet .kr .key{flex:none}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <span class="brand"><span class="dot"></span>main</span>
    <span class="tag" id="aheadTag"></span>
    <span class="sep"></span>
    <div class="seg" role="tablist" id="modeSeg">
      <button role="tab" data-mode="changes">Changes <i id="segChanges"></i></button>
      <button role="tab" data-mode="history" aria-selected="true">History</button>
    </div>
    <span class="grow"></span>
    <button class="btn plain sm" id="fetchBtn">Fetch</button>
    <button class="btn sm" id="pullBtn">Pull</button>
    <button class="btn sm solid" id="pushBtn">Push 3</button>
    <span class="sep"></span>
    <button class="btn plain icon" id="focusBtn" title="Focus mode (f)">◱</button>
    <button class="btn plain icon" id="helpBtn" title="Shortcuts (?)">?</button>
  </header>

  <aside class="side">
    <div class="side-top">
      <label class="filter"><span class="g">⌕</span>
        <input id="filterInput" placeholder="Filter…" spellcheck="false" />
        <span class="key">/</span>
      </label>
    </div>
    <div class="side-list" id="sideList"></div>
    <div class="compose" id="compose" hidden>
      <textarea id="msg" placeholder="Describe the change…" spellcheck="false"></textarea>
      <div class="r">
        <button class="btn sm solid" id="commitBtn" disabled>Commit</button>
        <span class="grow"></span>
        <span style="font-size:11px;color:var(--text-3)" id="stageHint"></span>
      </div>
    </div>
  </aside>

  <main class="main" id="main"></main>

  <nav class="outline" id="outline"></nav>

  <footer class="status">
    <span><span class="key">j</span><span class="key">k</span> commit</span>
    <span><span class="key">n</span><span class="key">p</span> file</span>
    <span><span class="key">[</span><span class="key">]</span> hunk</span>
    <span><span class="key">space</span> reviewed</span>
    <span><span class="key">i</span> split</span>
    <span class="grow"></span>
    <span id="statusRight"></span>
  </footer>
</div>

<div class="selbar" id="selbar">
  <span class="c" id="selCount"></span>
  <button class="btn sm" id="copySel">Copy</button>
  <button class="btn sm plain" id="clearSel">Clear <span class="key">esc</span></button>
</div>
<div class="toast" id="toast"></div>
<div class="sheet" id="sheet"><div class="card">
  <h3>Shortcuts</h3>
  <div class="keys" id="sheetKeys"></div>
</div></div>

<script>
/* =========================================================================
 * 1. Data
 * ====================================================================== */
const AUTHOR = 'nodelike';

const WORKING = [
  {st:'M', p:'src/components/', n:'CommitReview.tsx', a:38, d:12, staged:false,
   why:'Review state moves into a reducer so files remember what you cleared.'},
  {st:'M', p:'src/styles/', n:'review.css', a:64, d:9, staged:false,
   why:'New diff treatment: 2px edge, whisper wash, quiet context.'},
  {st:'?', p:'src/components/', n:'OutlineRail.tsx', a:71, d:0, staged:false,
   why:'Untracked. Scroll-spy file index for the review document.'},
];

/* Reusable hunk material, so every commit in the list opens onto real code. */
const H = {
  radius:{cap:'@@ -11,9 +11,13 @@', sc:':root', gap:10,
    before:[[8,'/* Modern shell direction */'],[9,''],[10,':root {']],
    lines:[
      ['ctx',11,11,'    /* Two radii, and only two: panels and controls. The four-step'],
      ['ctx',12,12,'     * ramp meant neighbouring elements rounded differently for no'],
      ['ctx',13,13,'     * reason anyone could name. */'],
      ['add',null,14,'    /* Radius scales with the control: 6px on an 18px button is a'],
      ['add',null,15,'     * third of its height and reads as a pill. */'],
      ['del',14,null,'    --radius-xs: 3px;'],
      ['add',null,16,'    --radius-chip: 3px;'],
      ['ctx',15,17,'    --radius-control: 6px;'],
      ['ctx',16,18,'    --radius-panel: 10px;'],
      ['add',null,19,'    --radius-xs: var(--radius-control);'],
  ]},
  roleList:{cap:'@@ -682,6 +684,5 @@', sc:'rounding by role', gap:662,
    before:[[679,'.shell'],[680,'    :where('],[681,'        .settings-row,')],
    lines:[
      ['ctx',682,684,'        .settings-depth,'],
      ['ctx',683,685,'        .git-toolbar,'],

 * 2. State

const state = {
  mode:'history',
  commit:5,           // index into COMMITS
  cursor:5,           // keyboard cursor in the sidebar
  filter:'',
  reviewed:{},        // `${hash}:${path}` -> true
  collapsed:{},
  split:{},           // per-file split view
  expanded:{},        // revealed context: `${key}:${hunkIndex}` -> true
  focusedFile:0,      // index within the current commit
  pick:null,          // {file, from, to} line selection
  msg:'',
};
const fileKey = (c,f) => `${c.h}:${f.p}${f.n}`;
const cur = () => COMMITS[state.commit];

/* =========================================================================
 * 3. Rendering helpers
 * ====================================================================== */
const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

function highlight(s, lang){
  if(/^\s*(\/\*|\*|\/\/|\*\/)/.test(s)) return `<span class="t-com">${esc(s)}</span>`;
  let o = esc(s);
  o = o.replace(/(&quot;[^&]*?&quot;|'[^']*?')/g,'<span class="t-str">$1</span>');
  if(lang==='css'){
    o = o.replace(/(!important|:where|var)\b/g,'<span class="t-key">$1</span>');
    o = o.replace(/(--[a-z][a-z0-9-]*)/g,'<span class="t-fn">$1</span>');
  }else{
    o = o.replace(/\b(const|let|return|function|export|import|useMemo|useState|from|undefined|Math)\b/g,'<span class="t-key">$1</span>');
  }
  o = o.replace(/\b(\d+(?:\.\d+)?(?:px|em|rem|%|s|ch)?)\b/g,'<span class="t-num">$1</span>');
  o = o.replace(/(\/\/[^<]*)$/,'<span class="t-com">$1</span>');
  return o;
}

/* Word-level marks: only where a del/add pair differs in a small middle span,
 * which is exactly the case where an inline mark helps instead of adding noise. */
const tokens = s => s.match(/(\s+|[A-Za-z_$][\w$-]*|\d+|.)/g) || [];
function pairMarks(delText, addText){
  const a = tokens(delText), b = tokens(addText);
  let p = 0; while(p<a.length && p<b.length && a[p]===b[p]) p++;
  let q = 0; while(q < a.length-p && q < b.length-p && a[a.length-1-q]===b[b.length-1-q]) q++;
  const midA = a.slice(p, a.length-q).join(''), midB = b.slice(p, b.length-q).join('');
  const share = (p+q) / Math.max(a.length, b.length);
  if(share < .34 || (!midA && !midB)) return null;   // too different to be a tweak
  return {
    del:[a.slice(0,p).join(''), midA, a.slice(a.length-q).join('')],
    add:[b.slice(0,p).join(''), midB, b.slice(b.length-q).join('')],
  };
}
function markLines(lines){
  /* walk runs of dels immediately followed by adds and pair them up */
  const marks = new Map();
  for(let i=0;i<lines.length;i++){
    if(lines[i][0] !== 'del') continue;
    let d = i; while(d<lines.length && lines[d][0]==='del') d++;
    let a = d; while(a<lines.length && lines[a][0]==='add') a++;
    const dels = lines.slice(i,d), adds = lines.slice(d,a);
    for(let k=0;k<Math.min(dels.length,adds.length);k++){
      const m = pairMarks(dels[k][3], adds[k][3]);
      if(m){ marks.set(i+k,{parts:m.del}); marks.set(d+k,{parts:m.add}); }
    }
    i = a-1;
  }
  return marks;
}

function srcHTML(line, lang, mark){
  if(!mark) return highlight(line[3], lang);
  const [pre,mid,suf] = mark.parts;
  return highlight(pre,lang) + (mid?`<em>${highlight(mid,lang)}</em>`:'') + highlight(suf,lang);
}

function rowHTML(line, lang, opts={}){
  const [t,o,n] = line;
  const side = opts.side;
  const no = side==='old' ? (o ?? '') : side==='new' ? (n ?? '') : (n ?? o ?? '');
  const picked = opts.picked ? ' picked' : '';
  const data = opts.id!=null ? ` data-line="${opts.id}"` : '';
  return `<div class="row ${t}${picked}"${data}>`
       + `<span class="n">${no}</span><span class="e"></span>`
       + `<span class="s">${srcHTML(line, lang, opts.mark)}</span></div>`;
}

function bars(a,d,n=8){
  const av = Math.max(a?1:0, Math.round(n*a/Math.max(1,a+d)));
  return `<span class="bars">${Array.from({length:n},(_,i)=>`<i class="${i<av?'a':'d'}"></i>`).join('')}</span>`;
}

/* =========================================================================
 * 5. Document
 * ====================================================================== */
function fileBodyHTML(c, f, fi){
  const key = fileKey(c,f);
  if(state.split[key]) return splitHTML(c,f,fi);
  let out = '<div class="code">';
  f.hunks.forEach((h,hi)=>{
    const open = state.expanded[`${key}:${hi}`];
    if(open && h.before){
      out += `<div class="skip"><span class="r"></span><button data-collapse="${fi}:${hi}">hide context</button><span class="r"></span></div>`;
      out += h.before.map(([n,s])=>rowHTML(['ctx',n,n,s], f.lang)).join('');
    }else{
      out += `<div class="skip"><span class="r"></span><button data-expand="${fi}:${hi}">${h.gap} unchanged lines</button><span class="r"></span></div>`;
    }
    out += `<div class="hcap" id="h-${fi}-${hi}"><span>${h.cap}</span><span class="sc">${esc(h.sc)}</span></div>`;
    const marks = markLines(h.lines);
    out += h.lines.map((l,li)=>{
      const id = `${fi}:${hi}:${li}`;
      const p = state.pick && state.pick.file===fi && cmpId(id,state.pick.from)>=0 && cmpId(id,state.pick.to)<=0;
      return rowHTML(l, f.lang, {id, mark:marks.get(li), picked:p});
    }).join('');
  });
  return out + '</div>';
}

function splitHTML(c,f,fi){
  const side = s => {
    let out = '';
    f.hunks.forEach(h=>{
      out += `<div class="skip"><span class="r"></span><button>${h.gap} unchanged</button><span class="r"></span></div>`;
      const adds = h.lines.filter(l=>l[0]==='add').length, dels = h.lines.filter(l=>l[0]==='del').length;
      const marks = markLines(h.lines);
      h.lines.forEach((l,li)=>{
        if(l[0]==='ctx') out += rowHTML(l,f.lang,{side:s,mark:marks.get(li)});
        else if(s==='old' && l[0]==='del') out += rowHTML(l,f.lang,{side:'old',mark:marks.get(li)});
        else if(s==='new' && l[0]==='add') out += rowHTML(l,f.lang,{side:'new',mark:marks.get(li)});
      });
      const pad = s==='old' ? adds-dels : dels-adds;
      for(let i=0;i<pad;i++) out += `<div class="row void"><span class="n"></span><span class="e"></span><span class="s"> </span></div>`;
    });
    return out;
  };
  return `<div class="split">
    <div class="half"><div class="cap">Before <span class="mono" style="color:var(--del)">${c.h}^</span></div><div class="code">${side('old')}</div></div>
    <div class="half"><div class="cap">After <span class="mono" style="color:var(--add)">${c.h}</span></div><div class="code">${side('new')}</div></div>
  </div>`;
}

    </div>

function renderOutline(){
  const c = cur();
  document.getElementById('outline').innerHTML = `
    <div class="lbl">Files</div>
    ${c.files.map((f,i)=>{
      const rev = !!state.reviewed[fileKey(c,f)];
      return `<button class="orow ${rev?'reviewed':''}" data-jump="${i}" aria-current="${i===state.focusedFile}">
        <span class="tick">${rev?'✓':''}</span>
        <span><span class="nm">${f.n}</span>
          <span class="sub"><span class="plus">+${f.a}</span><span class="minus">−${f.d}</span></span></span>
      </button>`;
    }).join('')}
    <div class="osep"></div>
    <div class="lbl">Neighbours</div>
    ${[[state.commit-1,'newer'],[state.commit+1,'older']].filter(([i])=>COMMITS[i]).map(([i,rel])=>`
      <button class="orow" data-commit="${i}">
        <span class="tick"></span>
        <span><span class="nm">${COMMITS[i].h}</span><span class="sub">${rel}</span></span>
      </button>`).join('')}`;
}

function renderStatus(){
  const c = cur();
  const done = c.files.filter(f=>state.reviewed[fileKey(c,f)]).length;
  const unpushed = COMMITS.filter(x=>x.unpushed).length;
  document.getElementById('statusRight').innerHTML =
    `<span class="num">${done}/${c.files.length}</span> reviewed · ${WORKING.length} uncommitted · ${unpushed} to push`;
  document.getElementById('aheadTag').innerHTML =
    `<span class="pin" style="color:var(--accent)"></span>${unpushed} to push`;
  document.getElementById('pushBtn').textContent = `Push ${unpushed}`;
}

/* scroll-spy: the focused file follows the viewport, and the outline follows it */
let io;
function observeFiles(){
  io?.disconnect();
  io = new IntersectionObserver(entries=>{
    const vis = entries.filter(e=>e.isIntersecting)
      .sort((a,b)=>a.boundingClientRect.top-b.boundingClientRect.top)[0];
    if(!vis) return;
    const i = Number(vis.target.dataset.file);
    if(i===state.focusedFile) return;
    state.focusedFile = i;
    document.querySelectorAll('.fsec').forEach(el=>
      el.classList.toggle('focused', Number(el.dataset.file)===i));
    document.querySelectorAll('.orow[data-jump]').forEach(el=>
      el.setAttribute('aria-current', String(Number(el.dataset.jump)===i)));
  }, {root:document.getElementById('main'), rootMargin:'-52px 0px -68% 0px'});
  document.querySelectorAll('.fsec').forEach(el=>io.observe(el));
}

 * 7. Actions
 * ====================================================================== */
function selectCommit(i, keep){
  if(!COMMITS[i]) return;
  state.commit = i; state.cursor = i; state.focusedFile = 0; state.pick = null;
  renderSide(); renderDoc(false); syncSelBar();
}
function toggleReview(fi, silent){
  const c = cur(), f = c.files[fi], key = fileKey(c,f);
  const now = !state.reviewed[key];
  state.reviewed[key] = now;
  state.collapsed[key] = now;                 // reviewing a file folds it away
  renderDoc(true); renderSide();
  if(now && !silent){
    const next = c.files.findIndex((x,i)=>i>fi && !state.reviewed[fileKey(c,x)]);
    if(next>-1) jumpFile(next);
    else toast('All files reviewed');
  }
}
function toggleCollapse(fi){
  const key = fileKey(cur(), cur().files[fi]);
  const rev = !!state.reviewed[key];
  state.collapsed[key] = !(state.collapsed[key] ?? rev);
  renderDoc(true);
}
function toggleSplit(fi){
  const key = fileKey(cur(), cur().files[fi]);
  state.split[key] = !state.split[key];
  state.collapsed[key] = false;
  renderDoc(true);
}
function jumpFile(i){
  const c = cur();
  state.focusedFile = Math.max(0, Math.min(c.files.length-1, i));
  document.getElementById(`f-${state.focusedFile}`)
    ?.scrollIntoView({block:'start', behavior:'smooth'});
}
function jumpHunk(dir){
  const caps = [...document.querySelectorAll('.hcap')];
  if(!caps.length) return;
  const main = document.getElementById('main');
  const y = main.scrollTop + 60;
  const tops = caps.map(el=>el.offsetTop);
  let target = dir>0 ? tops.find(t=>t>y+4) : [...tops].reverse().find(t=>t<y-4);
  if(target==null) target = dir>0 ? tops[tops.length-1] : tops[0];
  main.scrollTo({top:target-52, behavior:'smooth'});
}
function cmpId(a,b){
  const A=a.split(':').map(Number), B=b.split(':').map(Number);
  for(let i=0;i<3;i++){ if(A[i]!==B[i]) return A[i]<B[i]?-1:1; }
  return 0;
}
function pickedText(){
  if(!state.pick) return '';
  const c = cur(), f = c.files[state.pick.file], out = [];
  f.hunks.forEach((h,hi)=>h.lines.forEach((l,li)=>{
    const id = `${state.pick.file}:${hi}:${li}`;
    if(cmpId(id,state.pick.from)>=0 && cmpId(id,state.pick.to)<=0) out.push(l[3]);
  }));
  return out.join('\n');
}
function syncSelBar(){
  const bar = document.getElementById('selbar');
  const n = state.pick ? pickedText().split('\n').length : 0;
  bar.classList.toggle('on', n>0);
  document.getElementById('selCount').textContent = `${n} line${n===1?'':'s'} selected`;
}
let toastTimer;
function toast(text){
  const el = document.getElementById('toast');
  el.textContent = text; el.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>el.classList.remove('on'), 1900);
}

/* =========================================================================
 * 8. Wiring
 * ====================================================================== */
const main = document.getElementById('main');

document.getElementById('modeSeg').addEventListener('click', e=>{
  const b = e.target.closest('button[data-mode]'); if(!b) return;
  state.mode = b.dataset.mode; state.filter=''; document.getElementById('filterInput').value='';
  renderSide();
});

document.getElementById('sideList').addEventListener('click', e=>{
  const commit = e.target.closest('[data-commit]');
  if(commit){ selectCommit(Number(commit.dataset.commit)); return; }
  const stage = e.target.closest('[data-stage]');
  if(stage){
    const f = WORKING[Number(stage.dataset.stage)];
    f.staged = !f.staged; renderSide();
  }
});

document.getElementById('filterInput').addEventListener('input', e=>{
  state.filter = e.target.value; renderSide();
});

document.getElementById('msg').addEventListener('input', e=>{
  state.msg = e.target.value; renderSide();
});

document.getElementById('commitBtn').addEventListener('click', ()=>{
  const staged = WORKING.filter(f=>f.staged);
  const subject = state.msg.trim().split('\n')[0];
  const hash = Math.random().toString(16).slice(2,9);
  COMMITS.unshift({
    h:hash, s:subject, t:'just now', tags:['HEAD','main'], unpushed:true,
    body:state.msg.trim().split('\n').slice(1).join('\n').trim(),
    files:staged.map(f=>({p:f.p,n:f.n,lang:f.n.endsWith('.css')?'css':'ts',a:f.a,d:f.d,why:f.why,hunks:[H.radius]})),
    a:staged.reduce((n,f)=>n+f.a,0), d:staged.reduce((n,f)=>n+f.d,0),
  });
  COMMITS.forEach((c,i)=>{ if(i>0) c.tags = (c.tags||[]).filter(t=>t!=='HEAD'&&t!=='main'); });
  for(let i=WORKING.length-1;i>=0;i--) if(WORKING[i].staged) WORKING.splice(i,1);
  state.msg=''; document.getElementById('msg').value='';
  state.mode='history';
  selectCommit(0);
  toast(`Committed ${hash} · ${staged.length} file${staged.length>1?'s':''}`);
});

document.getElementById('pushBtn').addEventListener('click', ()=>{
  const n = COMMITS.filter(c=>c.unpushed).length;
  COMMITS.forEach(c=>c.unpushed=false);
  const head = COMMITS.find(c=>(c.tags||[]).includes('HEAD'));
  if(head) head.tags = [...new Set([...(head.tags||[]),'origin/main'])];
  renderSide(); renderDoc(true);
  toast(`Pushed ${n} commit${n===1?'':'s'} to origin/main`);
});
document.getElementById('pullBtn').addEventListener('click', ()=>toast('Already up to date with origin/main'));
document.getElementById('fetchBtn').addEventListener('click', ()=>toast('Fetched · nothing new'));

main.addEventListener('click', e=>{
  const rv = e.target.closest('[data-review]');
  if(rv){ toggleReview(Number(rv.dataset.review)); return; }
  const sp = e.target.closest('[data-split]');
  if(sp){ toggleSplit(Number(sp.dataset.split)); return; }
  const tg = e.target.closest('[data-toggle]');
  if(tg){ toggleCollapse(Number(tg.dataset.toggle)); return; }
  const ex = e.target.closest('[data-expand]');
  if(ex){
    const [fi,hi] = ex.dataset.expand.split(':');
    const key = `${fileKey(cur(),cur().files[fi])}:${hi}`;
    if(!cur().files[fi].hunks[hi].before){ toast('No stored context above this hunk'); return; }
    state.expanded[key] = true; renderDoc(true); return;
  }
  const cl = e.target.closest('[data-collapse]');
  if(cl){
    const [fi,hi] = cl.dataset.collapse.split(':');
    delete state.expanded[`${fileKey(cur(),cur().files[fi])}:${hi}`];
    renderDoc(true); return;
  }
  if(e.target.id==='copyHash'){
    navigator.clipboard?.writeText(cur().h); toast(`Copied ${cur().h}`); return;
  }
  if(e.target.id==='markAll'){
    const c = cur(); const all = c.files.every(f=>state.reviewed[fileKey(c,f)]);
    c.files.forEach(f=>{ state.reviewed[fileKey(c,f)] = !all; state.collapsed[fileKey(c,f)] = !all; });
    renderDoc(true); renderSide(); toast(all?'Reopened every file':'Marked all reviewed'); return;
  }
  if(e.target.id==='expandAll'){
    const c = cur(); c.files.forEach(f=>{ state.collapsed[fileKey(c,f)] = false; });
    renderDoc(true); return;
  }
  /* line selection on the number gutter */
  const n = e.target.closest('.row .n');
  if(n){
    const rowEl = n.parentElement, id = rowEl.dataset.line;
    if(!id) return;
    const fi = Number(id.split(':')[0]);
    if(e.shiftKey && state.pick && state.pick.file===fi){
      const {from} = state.pick;
      state.pick = {file:fi, from: cmpId(id,from)<0?id:from, to: cmpId(id,from)<0?from:id};
    }else{
      state.pick = {file:fi, from:id, to:id};
    }
    renderDoc(true); syncSelBar(); return;
  }
});

document.getElementById('outline').addEventListener('click', e=>{
  const j = e.target.closest('[data-jump]');
  if(j){ jumpFile(Number(j.dataset.jump)); return; }
  const c = e.target.closest('[data-commit]');
  if(c) selectCommit(Number(c.dataset.commit));
});

document.getElementById('copySel').addEventListener('click', ()=>{
  const text = pickedText();
  navigator.clipboard?.writeText(text);
  toast(`Copied ${text.split('\n').length} lines`);
});
document.getElementById('clearSel').addEventListener('click', ()=>{
  state.pick=null; renderDoc(true); syncSelBar();
});

const focusBtn = document.getElementById('focusBtn');
focusBtn.addEventListener('click', ()=>{
  document.body.classList.toggle('focusmode');
  focusBtn.setAttribute('aria-pressed', document.body.classList.contains('focusmode'));
  toast(document.body.classList.contains('focusmode') ? 'Focus mode · rails hidden' : 'Rails back');
});
const sheet = document.getElementById('sheet');
const KEYS = [
  ['j / k','move the commit cursor'],['enter','open the commit'],
  ['n / p','next · previous file'],['[ / ]','previous · next hunk'],
  ['space','mark the focused file reviewed'],['a','mark every file reviewed'],
  ['i','split view for the focused file'],['e','expand context above the hunk'],
  ['c','collapse the focused file'],['f','focus mode'],
  ['/','filter the sidebar'],['1 / 2','changes · history'],
  ['d','tighten line height'],['esc','clear selection'],
];
document.getElementById('sheetKeys').innerHTML =
  KEYS.map(([k,d])=>`<div class="kr"><span class="key">${k}</span><span>${d}</span></div>`).join('');
document.getElementById('helpBtn').addEventListener('click', ()=>sheet.classList.add('on'));
sheet.addEventListener('click', ()=>sheet.classList.remove('on'));

document.addEventListener('keydown', e=>{
  const typing = /^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName);
  if(typing){
    if(e.key==='Escape') document.activeElement.blur();
    return;
  }
  const k = e.key;
  if(k==='/'){ e.preventDefault(); document.getElementById('filterInput').focus(); return; }
  if(k==='?'){ sheet.classList.toggle('on'); return; }
  if(k==='Escape'){ sheet.classList.remove('on'); if(state.pick){state.pick=null;renderDoc(true);syncSelBar();} return; }
  if(k==='1'){ state.mode='changes'; renderSide(); return; }
  if(k==='2'){ state.mode='history'; renderSide(); return; }
  if(k==='j'||k==='k'){
    const d = k==='j'?1:-1;
    state.cursor = Math.max(0, Math.min(COMMITS.length-1, state.cursor+d));
    renderSide();
    document.querySelector('.crow.cursor')?.scrollIntoView({block:'nearest'});
    return;
  }
  if(k==='Enter'){ selectCommit(state.cursor); return; }
  if(k==='n'){ jumpFile(state.focusedFile+1); return; }
  if(k==='p'){ jumpFile(state.focusedFile-1); return; }
  if(k===']'){ e.preventDefault(); jumpHunk(1); return; }
  if(k==='['){ e.preventDefault(); jumpHunk(-1); return; }
  if(k===' '){ e.preventDefault(); toggleReview(state.focusedFile); return; }
  if(k==='a'){ document.getElementById('markAll')?.click(); return; }
  if(k==='i'){ toggleSplit(state.focusedFile); return; }
  if(k==='c'){ toggleCollapse(state.focusedFile); return; }
  if(k==='f'){ focusBtn.click(); return; }
  if(k==='e'){
    const fi = state.focusedFile;
    document.querySelector(`#f-${fi} [data-expand]`)?.click();
    return;
  }
  if(k==='d'){
    document.body.classList.toggle('tight');
    toast(document.body.classList.contains('tight') ? 'Tighter leading' : 'Relaxed leading');
    return;
  }
});

/* boot */
renderSide();
renderDoc(false);
</script>
