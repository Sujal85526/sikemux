[package]
name = "sikemux-mobile"
version = "0.1.0"
edition = "2021"
publish = false
description = "The core's client, pairing and connection, as the phone app calls them"

[lib]
crate-type = ["lib", "staticlib", "cdylib"]

[dependencies]
iroh = { version = "1.3", default-features = false, features = ["tls-ring"] }
serde_json = "1"
sikemux-core = { path = "../sikemux-core" }
thiserror = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }
uniffi = "0.31"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
