<?xml version="1.0" encoding="UTF-8"?>
<!--
  sikemux logo — macOS app icon source.
  Regenerate: pnpm tauri icon src-tauri/icons/logo.svg

  Why this looks the way it does:
    * 1024×1024 canvas + rx=230 (~22.5%) approximates the macOS Big Sur+
      squircle. SVG's circular rounded-rect isn't a true squircle but is
      visually close enough at icon sizes.
    * Background is a linear gradient — every native macOS icon (Xcode,
      Finder, Music, …) uses a top-light → bottom-dark wash. Flat #000000
      reads as a placeholder next to gradient-bg neighbours.
    * Content fills the 824×824 grid (Apple's "icon grid" — same visual
      weight as native apps). After scale=3.52 and the centre-translate,
      the drawn extents land ~(98,75)..(926,980).
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1a26"/>
      <stop offset="0.55" stop-color="#0c0b14"/>
      <stop offset="1" stop-color="#040408"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" rx="230" ry="230" fill="url(#bg)"/>

  <!-- No baked shadow/highlight: ready for Icon Composer to layer Liquid
       Glass effects on top when migrated to the .icon format. On legacy
       macOS this renders as flat fill (which is what the system expects
       from pre-Tahoe icons anyway). -->
  <g transform="translate(-243, -35) scale(3.52)" fill="#FFFFFF">
    <polygon points="257,72 331,29 331,114"/>
    <polygon points="98,199 172,241 98,284"/>
    <path d="M108 54
             C100 72, 96 90, 98 104
             C100 119, 106 133, 121 144
             C129 151, 139 158, 151 164
             L286 223
             C297 228, 306 236, 313 245
             C317 250, 320 255, 321 259
             C327 246, 331 229, 331 209
             C330 201, 328 194, 324 189
             C319 181, 314 175, 308 169
             C300 162, 290 155, 278 149
             L143 90
             C137 87, 132 84, 128 80
             C122 76, 117 71, 108 54
             Z"/>
  </g>
</svg>
