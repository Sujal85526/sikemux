# sikemux-sim links. Regenerate with that script rather than editing.

name: FBSimulatorControl

options:
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top
  bundleIdPrefix: com.facebook

configFiles:
