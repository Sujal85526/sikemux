[package]
name = "sikemux"
version = "0.1.0"
description = "A GUI terminal multiplexer"
authors = ["nodelike"]
edition = "2021"

[lib]
name = "sikemux_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", default-features = false, features = ["wry"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"
git2 = { version = "0.19", default-features = false }
rusqlite = "0.32"
notify = { version = "6", default-features = false, features = ["macos_fsevent"] }
dashmap = "6"
similar = "2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
