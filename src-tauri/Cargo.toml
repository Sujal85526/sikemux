[package]
name = "sikemux"
version = "0.1.20"
description = "A GUI terminal multiplexer"
authors = ["nodelike"]
edition = "2021"

[lib]
name = "sikemux_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", default-features = false, features = ["wry", "macos-private-api"] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"
vt100 = "0.16"
git2 = { version = "0.19", default-features = false }
rusqlite = "0.32"
notify = { version = "6", default-features = false, features = ["macos_fsevent"] }
dashmap = "6"
similar = "2"
ignore = "0.4"
grep-matcher = "0.1"
grep-regex = "0.1"
grep-searcher = "0.1"
globset = "0.4"
regex = "1"
rayon = "1"
url = "2"
tempfile = "3"
linked-hash-map = "0.5"
thiserror = "1"
futures = "0.3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "time", "sync", "net", "io-util"] }
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip", "stream", "cookies", "multipart"] }
objc2 = "0.6"
objc2-foundation = "0.3"

[profile.release]
# opt-level "z" trades a few % runtime for a meaningfully smaller binary
# (libgit2 + rustls dominate; size-opt knocks ~3-4 MB off the 20 MB total).
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
